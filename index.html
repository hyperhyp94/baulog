<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="apple-touch-icon" href="/icons/icon-180.png">
  <link rel="manifest" href="/icons/manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Baulog">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="theme-color" content="#1A1A1A">
  <title>Baulog · Hyper WorkWise</title>
  <style>
    :root { --ink:#1A1A1A; --grey:#5C5C5C; --line:#CFCFCB; --fill:#F4F4F2;
            --green:#2E7D5B; --hellgruen:#8ECDB0; --red:#B23A3A; --amber:#B07D10;
            --bg:#FAFAFA; }
    * { box-sizing: border-box; }
    html, body { overflow-x: hidden; }
    body { font-family: Arial, "Liberation Sans", sans-serif; color: var(--ink);
           margin: 0; background: var(--bg); }
    body.mit-leiste { padding-bottom: 84px; }
    @media (min-width:640px) { body.mit-leiste { padding-bottom: 0; } }

    /* ---------- Kopfzeile ---------- */
    .topnav { background: var(--ink); color: #fff; position: sticky; top: 0; z-index: 40; }
    .topnav-innen { max-width: 1000px; margin: 0 auto; padding: 10px 16px;
                    display: flex; gap: 18px; align-items: center; justify-content: space-between; }
    .marke { font-weight: bold; letter-spacing: 2px; font-size: 13px; color: #fff;
             text-decoration: none; }
    .marke span { color: var(--hellgruen); }
    .kopf-links { display: flex; gap: 16px; }
    .kopf-links a { color: var(--line); text-decoration: none; font-size: 14px; padding: 6px 2px; }
    .kopf-links a.aktiv, .kopf-links a:hover { color: #fff; }
    main { max-width: 1000px; margin: 16px auto; padding: 0 16px; }
    h1 { font-size: 24px; margin: 0; line-height: 1.2; overflow-wrap: anywhere; }
    h2 { font-size: 16px; margin: 24px 0 8px; }

    /* ---------- Bausteine ---------- */
    .muted { color: var(--grey); font-size: 13px; }
    .leer { text-align: center; color: var(--grey); padding: 36px 12px; font-size: 14px;
            background: #fff; border: 1px dashed var(--line); }
    .leer p { margin: 0 0 12px; }
    .box { background: #fff; border: 1px solid var(--line); margin-bottom: 12px; }
    .seitenkopf { display: flex; align-items: center; justify-content: space-between;
                  gap: 8px; margin: 0 0 12px; flex-wrap: wrap; }
    .spacer { flex: 1; }
    .badge { display: inline-block; padding: 2px 8px; font-size: 11px; white-space: nowrap;
             border: 1px solid var(--line); background: var(--fill); color: var(--grey); }
    .badge.ohne { border-color: var(--red); color: var(--red); background: #fff; }
    .badge.gewerk { background: #fff; }

    button, .btn { font: inherit; font-size: 14px; padding: 8px 14px;
                   border: 1px solid var(--ink); background: var(--ink); color: #fff;
                   cursor: pointer; text-decoration: none; display: inline-flex;
                   align-items: center; justify-content: center; gap: 6px; min-height: 44px; }
    button:disabled { opacity: .5; cursor: default; }
    .hell { background: #fff !important; color: var(--ink) !important; border-color: var(--line) !important; }
    .rot { background: #fff !important; color: var(--red) !important; border-color: var(--red) !important; }
    .rot-voll { background: var(--red) !important; border-color: var(--red) !important; color: #fff !important; }
    .gruen { background: var(--green) !important; border-color: var(--green) !important; }
    .klein { min-height: 34px !important; padding: 4px 10px !important; font-size: 13px !important; }
    .linkbtn { background: none; border: none; padding: 0; min-height: 0; color: var(--green);
               font-weight: bold; font-size: 13px; cursor: pointer; }
    .linkbtn:hover { text-decoration: underline; }
    .linkbtn.rot-link { color: var(--red); }

    input, select, textarea { font: inherit; font-size: 16px; padding: 10px;
                              border: 1px solid var(--line); width: 100%;
                              background: #fff; min-height: 46px; color: var(--ink);
                              border-radius: 0; }
    input:focus, select:focus, textarea:focus { outline: 2px solid var(--green); outline-offset: -1px; }
    textarea { min-height: 80px; resize: vertical; }
    label { font-size: 13px; color: var(--grey); display: block; margin: 14px 0 4px; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
    .grid3 { display: grid; grid-template-columns: 1fr 1fr 1.3fr; gap: 0 10px; }
    @media (max-width:400px) { .grid2.umbruch { grid-template-columns: 1fr; } }
    .unterfeld { background: var(--fill); padding: 10px; margin-top: 6px; }
    .unterfeld input, .unterfeld select { margin-top: 0; }
    .unterfeld > * + * { margin-top: 8px; }
    .hidden { display: none !important; }

    /* Umschalter (Mit/Ohne Rechnung, Offen/Bezahlt …) */
    .seg { display: flex; border: 1px solid var(--line); background: #fff; }
    .seg button { flex: 1; background: #fff; color: var(--grey); border: none; min-height: 44px;
                  border-right: 1px solid var(--line); font-size: 14px; padding: 6px 8px; }
    .seg button:last-child { border-right: none; }
    .seg button.an { background: var(--ink); color: #fff; font-weight: bold; }

    /* ---------- Projektliste ---------- */
    .listenkopf { display: flex; align-items: flex-end; justify-content: space-between;
                  gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
    .projekte { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
    .pkarte { display: block; background: #fff; border: 1px solid var(--line); padding: 16px;
              color: inherit; text-decoration: none; border-left: 4px solid var(--green); }
    .pkarte:hover { border-color: var(--ink); border-left-color: var(--green); }
    .pk-name { font-size: 18px; font-weight: bold; margin-bottom: 4px; overflow-wrap: anywhere; }
    .pk-notiz { color: var(--grey); font-size: 13px; margin-bottom: 12px; overflow-wrap: anywhere; }
    .pk-zahlen { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--grey); }
    .pk-zahlen b { display: block; font-size: 18px; color: var(--ink); }
    .pk-oeffnen { margin-top: 12px; font-size: 13px; font-weight: bold; color: var(--green); }

    /* ---------- Projektseite ---------- */
    .zurueck { display: inline-block; color: var(--green); text-decoration: none; font-size: 14px;
               font-weight: bold; margin-bottom: 10px; padding: 4px 0; }
    .pkopf { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
             margin-bottom: 14px; }
    .pkopf .muted { margin-top: 4px; }
    .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(135px, 1fr));
            gap: 8px; margin-bottom: 14px; }
    .kpi { background: #fff; border: 1px solid var(--line); padding: 10px 12px; text-align: left;
           color: inherit; font: inherit; }
    .kpi .zahl { font-size: 19px; font-weight: bold; }
    .kpi .label { color: var(--grey); font-size: 12px; margin-top: 2px; }
    .kpi.warn .zahl { color: var(--amber); }
    .kpi.haupt { border-color: var(--ink); }
    button.kpi { display: block; min-height: 0; cursor: pointer; }
    button.kpi:hover { border-color: var(--ink); }

    .aktionsleiste { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    .aktionsleiste button { font-weight: bold; }
    @media (max-width:639px) {
      .aktionsleiste { position: fixed; left: 0; right: 0; bottom: 0; z-index: 45; margin: 0;
                       background: #fff; border-top: 1px solid var(--line); flex-wrap: nowrap;
                       padding: 8px 8px calc(8px + env(safe-area-inset-bottom)); }
      .aktionsleiste button { flex: 1; padding: 6px 4px; font-size: 13px; min-height: 52px;
                              flex-direction: column; gap: 0; }
      .aktionsleiste .nur-desktop { display: none; }
    }
    .aktionsleiste .plus { font-size: 18px; line-height: 1; }

    .bereiche { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; align-items: center; }
    .chip { background: #fff; color: var(--ink); border: 1px solid var(--line); min-height: 34px;
            padding: 4px 12px; font-size: 13px; }
    .chip.an { background: var(--ink); color: #fff; border-color: var(--ink); }

    .ptabs { display: flex; border-bottom: 2px solid var(--line); margin-bottom: 14px;
             overflow-x: auto; scrollbar-width: none; }
    .ptabs::-webkit-scrollbar { display: none; }
    .ptabs a { padding: 10px 14px; color: var(--grey); text-decoration: none; font-size: 14px;
               white-space: nowrap; border-bottom: 3px solid transparent; margin-bottom: -2px; }
    .ptabs a.aktiv { color: var(--ink); font-weight: bold; border-bottom-color: var(--green); }
    .ptabs a span { font-size: 11px; background: var(--fill); padding: 1px 6px; margin-left: 4px;
                    color: var(--grey); font-weight: normal; }

    /* Logbuch */
    .filter { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
              gap: 8px; margin-bottom: 14px; }
    .filter select { min-height: 40px; font-size: 14px; padding: 7px; }
    .tag { margin-bottom: 14px; }
    .tag-kopf { display: flex; justify-content: space-between; font-size: 13px; font-weight: bold;
                color: var(--grey); padding: 4px 2px 6px; }
    .eintrag { display: flex; align-items: stretch; background: #fff; border: 1px solid var(--line);
               margin-bottom: -1px; }
    .e-haupt { flex: 1; display: flex; align-items: center; gap: 10px; background: #fff; color: var(--ink);
               border: none; text-align: left; padding: 10px 12px; min-height: 58px; min-width: 0; }
    .e-haupt:hover { background: var(--fill); }
    .e-typ { flex: none; width: 34px; height: 34px; display: flex; align-items: center;
             justify-content: center; font-size: 11px; font-weight: bold; border: 1px solid var(--line); }
    .e-typ.zeit { background: #EAF4EF; color: var(--green); border-color: var(--hellgruen); }
    .e-typ.material { background: #FBF3E3; color: var(--amber); border-color: #E3C98E; }
    .e-text { flex: 1; min-width: 0; font-size: 14px; line-height: 1.35; }
    .e-text b { overflow-wrap: anywhere; }
    .e-text small { display: block; color: var(--grey); font-size: 12px; white-space: nowrap;
                    overflow: hidden; text-overflow: ellipsis; }
    .e-betrag { flex: none; font-weight: bold; font-size: 15px; white-space: nowrap; }
    .zahlung { flex: none; width: 86px; border: none; border-left: 1px solid var(--line);
               font-size: 12px; font-weight: bold; padding: 4px; min-height: 0;
               flex-direction: column; gap: 2px; }
    .zahlung.offen { background: #fff; color: var(--amber); }
    .zahlung.bezahlt { background: #EAF4EF; color: var(--green); }
    .zahlung.teil { background: #FFF6E0; color: var(--amber); }
    @media (max-width:420px) { .zahlung { width: 72px; } .e-typ { display: none; } }
    @media (max-width:639px) {
      .kpis { grid-template-columns: 1fr 1fr; gap: 6px; }
      .kpi { padding: 8px 10px; }
      .kpi .zahl { font-size: 17px; }
      .kpi.haupt { grid-column: 1 / -1; }
    }

    /* Aufgaben */
    .aufgabe { background: #fff; border: 1px solid var(--line); padding: 12px; margin-bottom: 8px;
               display: flex; gap: 12px; align-items: flex-start; }
    .aufgabe.fertig { opacity: .7; }
    .a-text { flex: 1; min-width: 0; }
    .a-titel { font-weight: bold; font-size: 15px; overflow-wrap: anywhere; }
    .a-meta { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0; align-items: center; }
    .a-zahlen { font-size: 13px; color: var(--grey); }
    .a-akt { display: flex; gap: 14px; margin-top: 8px; }
    .status { min-height: 30px; padding: 2px 10px; font-size: 12px; font-weight: bold; border: 1px solid; }
    .status.offen { background: #fff; color: var(--amber); border-color: var(--amber); }
    .status.inarbeit { background: var(--amber); color: #fff; border-color: var(--amber); }
    .status.fertig { background: #fff; color: var(--green); border-color: var(--green); }
    .a-betrag { font-weight: bold; white-space: nowrap; }

    /* Belege */
    .galerie { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
    .doc { background: #fff; border: 1px solid var(--line); display: flex; flex-direction: column; }
    .doc-bild { display: flex; align-items: center; justify-content: center; height: 120px;
                background: var(--fill); color: var(--grey); text-decoration: none; font-weight: bold;
                overflow: hidden; }
    .doc-bild img { width: 100%; height: 100%; object-fit: cover; }
    .doc-info { padding: 8px 10px; font-size: 13px; display: flex; flex-direction: column; gap: 2px; flex: 1; }
    .doc-name { font-weight: bold; overflow-wrap: anywhere; font-size: 13px; }
    .doc-akt { display: flex; gap: 12px; margin-top: auto; padding-top: 6px; flex-wrap: wrap; }
    .doc-akt a { color: var(--green); font-weight: bold; text-decoration: none; font-size: 13px; }

    /* Auswertung */
    table { width: 100%; border-collapse: collapse; background: #fff; }
    th { background: #E7E7E3; text-align: left; font-size: 12px; padding: 8px 10px;
         border-bottom: 1px solid var(--line); }
    td { padding: 9px 10px; border-bottom: 1px solid var(--line); font-size: 14px; vertical-align: top; }
    td.r, th.r { text-align: right; white-space: nowrap; }
    tr.summenzeile td { font-weight: bold; background: var(--fill); }
    .scrollx { overflow-x: auto; border: 1px solid var(--line); }
    .scrollx table { border: none; }
    .balken { background: var(--fill); height: 6px; margin-top: 5px; }
    .balken > div { background: var(--green); height: 6px; }

    /* Personen */
    .person { background: #fff; border: 1px solid var(--line); padding: 12px; margin-bottom: 8px;
              display: flex; gap: 12px; align-items: center; }
    .person.inaktiv { opacity: .6; }

    /* ---------- Modal ---------- */
    #modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 50;
                      display: flex; align-items: flex-end; justify-content: center; }
    @media (min-width:640px) { #modal-backdrop { align-items: center; padding: 16px; } }
    #modal-backdrop.hidden { display: none; }
    #modal-box { background: #fff; width: 100%; max-width: 560px; max-height: 92vh;
                 display: flex; flex-direction: column; animation: hoch .15s ease-out; }
    #modal-content { display: flex; flex-direction: column; min-height: 0; flex: 1; }
    .modal-kopf { display: flex; align-items: center; justify-content: space-between;
                  padding: 12px 16px; border-bottom: 1px solid var(--line); flex: none; }
    .modal-kopf h2 { margin: 0; font-size: 17px; }
    .modal-kopf button { background: none; border: none; color: var(--ink); font-size: 22px;
                         min-height: 40px; width: 40px; padding: 0; }
    .modal-body { padding: 4px 16px 16px; overflow-y: auto; flex: 1; }
    .modal-fuss { display: flex; gap: 8px; padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
                  border-top: 1px solid var(--line); flex: none; flex-wrap: wrap; background: #fff; }
    .modal-fuss button { min-width: 100px; }
    .summe { margin-top: 14px; padding: 10px 12px; background: var(--fill); font-size: 15px;
             display: flex; justify-content: space-between; }
    .summe b { font-size: 17px; }
    .fix { padding: 10px; background: var(--fill); font-size: 14px; }
    .vorschlag { display: flex; align-items: flex-end; padding-bottom: 6px; }
    .hinweis { font-size: 13px; color: var(--grey); margin: 8px 0 0; }
    details.erweitert { margin-top: 18px; border-top: 1px solid var(--line); padding-top: 10px; }
    details.erweitert summary { cursor: pointer; font-size: 14px; font-weight: bold; padding: 6px 0; }
    .bereich-zeile { display: flex; justify-content: space-between; align-items: center; gap: 8px;
                     padding: 8px 0; border-bottom: 1px solid var(--fill); font-size: 14px; }

    /* ---------- Toast ---------- */
    #toast-container { position: fixed; bottom: 96px; left: 12px; right: 12px; z-index: 60;
                       display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
    @media (min-width:640px) { #toast-container { bottom: 16px; left: auto; right: 16px; width: 340px; } }
    .toast { pointer-events: auto; padding: 12px 14px; font-size: 14px; color: #fff;
             background: var(--ink); animation: hoch .2s ease-out; }
    .toast.success { background: var(--green); }
    .toast.error { background: var(--red); }
    @keyframes hoch { from { transform: translateY(30px); opacity: 0; } to { transform: none; opacity: 1; } }
  </style>
</head>
<body>

<header class="topnav">
  <div class="topnav-innen">
    <a href="#/" class="marke"><span>∞</span> BAULOG</a>
    <nav class="kopf-links">
      <a href="#/" data-nav="projekte">Projekte</a>
      <a href="#/personen" data-nav="personen">Personen</a>
      <a href="#/verlauf" data-nav="verlauf">Verlauf</a>
      <a href="javascript:void 0" onclick="kiEinstellungen()" title="KI für Kassenbons einstellen" aria-label="KI-Einstellungen">⚙</a>
    </nav>
  </div>
</header>

<main>
  <div id="view"><div class="leer">Wird geladen…</div></div>
</main>

<div id="modal-backdrop" class="hidden">
  <div id="modal-box" role="dialog" aria-modal="true"><div id="modal-content"></div></div>
</div>

<div id="toast-container"></div>

<script>
'use strict';

// ============================================================
// ZUSTAND
// ============================================================
// App: globale Stammdaten. P: das aktuell geöffnete Projekt mit allen Einträgen.
const App = { persons: [], paperless: false };
let P = null;

const ERLAUBTE_DATEIEN = '.jpg,.jpeg,.png,.webp,.pdf,image/jpeg,image/png,image/webp,application/pdf';
const GEWERK_VORSCHLAEGE = ['Abbruch', 'Trockenbau', 'Elektro', 'Sanitär', 'Heizung', 'Maler',
  'Fliesen', 'Boden', 'Fenster', 'Türen', 'Dach', 'Maurer', 'Putz', 'Reinigung'];
const EINHEITEN = ['Stk', 'm', 'm²', 'm³', 'kg', 'l', 'Sack', 'Rolle', 'Paket', 'Pauschal', 'Anfahrt'];

// ============================================================
// HILFSFUNKTIONEN
// ============================================================
const $ = (sel) => document.querySelector(sel);
const EUR = new Intl.NumberFormat('de-DE', { style: 'currency', currency: 'EUR' });
const WOCHENTAGE = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];

function euro(v) { return EUR.format(Number(v) || 0); }
function zahl(v) { return (Number(v) || 0).toLocaleString('de-DE', { maximumFractionDigits: 2 }); }
function r2(v) { return Math.round((Number(v) || 0) * 100) / 100; }
function zahlEin(v) { return v == null ? '' : String(v).replace('.', ','); }
function anzahl(n, einzahl, mehrzahl) { return `${n} ${n === 1 ? einzahl : mehrzahl}`; }

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// "6,5" und "6.5" akzeptieren; "1.234,50" ebenfalls.
function parseZahl(s) {
  s = String(s ?? '').trim().replace(/\s/g, '').replace('€', '');
  if (!s) return NaN;
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  return Number(s);
}

function isoDatum(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
function heute() { return isoDatum(new Date()); }
// created_at ist UTC (ISO) — für die Anzeige in lokales Datum umrechnen
function lokalesDatum(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  return isNaN(d) ? String(ts).slice(0, 10) : isoDatum(d);
}
function datumKurz(iso) {
  if (!iso) return '';
  const [y, m, d] = iso.split('-');
  return `${d}.${m}.${y}`;
}
function datumLang(iso) {
  if (!iso) return 'Ohne Datum';
  const g = new Date();
  const gestern = new Date(g.getFullYear(), g.getMonth(), g.getDate() - 1);
  if (iso === heute()) return 'Heute · ' + datumKurz(iso);
  if (iso === isoDatum(gestern)) return 'Gestern · ' + datumKurz(iso);
  const [y, m, d] = iso.split('-').map(Number);
  return WOCHENTAGE[new Date(y, m - 1, d).getDay()] + ', ' + datumKurz(iso);
}

// ============================================================
// API
// ============================================================
async function api(method, path, body) {
  const opts = { method, headers: {} };
  if (body !== undefined) {
    opts.headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(body);
  }
  let res;
  try { res = await fetch(path, opts); }
  catch (e) { throw new Error('Keine Verbindung zum Server: ' + e.message); }
  let json;
  try { json = await res.json(); } catch { json = {}; }
  if (!res.ok || json.error) {
    const err = new Error(json.error || 'Fehler ' + res.status);
    err.status = res.status;
    throw err;
  }
  return json;
}

async function apiUpload(formData) {
  let res;
  try { res = await fetch('/api/documents', { method: 'POST', body: formData }); }
  catch (e) { throw new Error('Keine Verbindung zum Server: ' + e.message); }
  let json;
  try { json = await res.json(); } catch { json = {}; }
  if (!res.ok || json.error) throw new Error(json.error || 'Fehler ' + res.status);
  return json;
}

async function ladePersonen() {
  const d = await api('GET', '/api/persons');
  App.persons = d.persons;
}

// ============================================================
// TOAST & MODAL
// ============================================================
function showToast(msg, typ) {
  const el = document.createElement('div');
  el.className = 'toast ' + (typ || '');
  el.textContent = msg;
  $('#toast-container').appendChild(el);
  setTimeout(() => el.remove(), typ === 'error' ? 6000 : 2800);
}
function showError(msg) { showToast(msg, 'error'); }

let modalGeaendert = false;
function openModal(html) {
  $('#modal-content').innerHTML = html;
  $('#modal-backdrop').classList.remove('hidden');
  modalGeaendert = false;
  const f = $('#modal-content [autofocus]');
  if (f && window.matchMedia('(min-width:640px)').matches) f.focus();
}
function closeModal() {
  $('#modal-backdrop').classList.add('hidden');
  $('#modal-content').innerHTML = '';
}
function modalKopf(titel) {
  return `<div class="modal-kopf"><h2>${esc(titel)}</h2>
    <button type="button" onclick="closeModal()" aria-label="Schließen">✕</button></div>`;
}
$('#modal-backdrop').addEventListener('click', ev => {
  // Klick daneben schließt nur, solange noch nichts eingegeben wurde
  if (ev.target.id === 'modal-backdrop' && !modalGeaendert) closeModal();
});
$('#modal-content').addEventListener('input', () => { modalGeaendert = true; });
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape' && !$('#modal-backdrop').classList.contains('hidden')) closeModal();
});

// Sperrt die Modal-Knöpfe während einer Speicher-Aktion; Fehler landen als Toast.
async function mitSperre(fn) {
  const knoepfe = [...document.querySelectorAll('#modal-box button')];
  knoepfe.forEach(b => b.disabled = true);
  try { await fn(); }
  catch (e) { showError(e.message); }
  finally { knoepfe.forEach(b => b.disabled = false); }
}

function bestaetigen(titel, htmlText, knopf, aktion) {
  openModal(`${modalKopf(titel)}
    <div class="modal-body"><p>${htmlText}</p></div>
    <div class="modal-fuss"><button class="hell" onclick="closeModal()">Abbrechen</button>
      <span class="spacer"></span><button class="rot-voll" id="m-ja">${esc(knopf)}</button></div>`);
  $('#m-ja').onclick = () => mitSperre(aktion);
}

// Umschalter: <div class="seg" data-seg="name"> mit Buttons data-v
function seg(name, wert, optionen) {
  return `<div class="seg" data-seg="${name}">${optionen.map(([v, l]) =>
    `<button type="button" data-v="${esc(v)}" class="${String(v) === String(wert) ? 'an' : ''}">${esc(l)}</button>`
  ).join('')}</div>`;
}
function segWert(name) {
  const b = document.querySelector(`.seg[data-seg="${name}"] button.an`);
  if (!b) return null;
  const v = b.dataset.v;
  return /^\d+$/.test(v) ? Number(v) : v;
}
document.addEventListener('click', ev => {
  const b = ev.target.closest('.seg button');
  if (!b) return;
  b.parentElement.querySelectorAll('button').forEach(x => x.classList.toggle('an', x === b));
  modalGeaendert = true;
});

// Zahlungsstatus im Formular: Offen / Teilweise (mit Betrag) / Bezahlt
function zahlungsFeld(eintrag) {
  const teil = eintrag && !eintrag.paid && eintrag.paid_amount > 0;
  const wert = eintrag && eintrag.paid ? 1 : (teil ? 2 : 0);
  return `<label>Schon bezahlt?</label>${seg('paid', wert, [[0, 'Noch offen'], [2, 'Teilweise'], [1, 'Bezahlt']])}
    <div id="f-teil-box" class="unterfeld ${teil ? '' : 'hidden'}">
      <label for="f-teil" style="margin-top:0">Davon schon gezahlt (€)</label>
      <input id="f-teil" inputmode="decimal" placeholder="z. B. 50" value="${teil ? zahlEin(eintrag.paid_amount) : ''}">
    </div>`;
}
function zahlungWerte() {
  const w = segWert('paid');
  if (w === 2) {
    const v = parseZahl($('#f-teil').value);
    if (!(v > 0)) throw new Error('Bitte den bereits gezahlten Betrag eintragen (mehr als 0).');
    return { paid: 0, paid_amount: v };
  }
  return { paid: w === 1 ? 1 : 0, paid_amount: 0 };
}
document.addEventListener('click', ev => {
  if (!ev.target.closest('.seg[data-seg="paid"] button')) return;
  const box = $('#f-teil-box');
  if (box) box.classList.toggle('hidden', segWert('paid') !== 2);
});

// Zuletzt gewählte Aufgabe/Person je Projekt merken (nur Komfort)
function gemerkt() {
  try { return JSON.parse(localStorage.getItem('baulog.zuletzt.' + P.pid)) || {}; }
  catch { return {}; }
}
function merke(obj) {
  try { localStorage.setItem('baulog.zuletzt.' + P.pid, JSON.stringify({ ...gemerkt(), ...obj })); }
  catch { /* ohne Speicher geht es auch */ }
}

// ============================================================
// ROUTING
// ============================================================
// #/              → Projektliste
// #/p/<id>/<tab>  → Projekt (tab: logbuch | aufgaben | belege | auswertung)
// #/personen      → Personen
async function route() {
  const teile = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
  closeModal();
  document.querySelectorAll('.kopf-links a').forEach(a =>
    a.classList.toggle('aktiv', a.dataset.nav === (['personen', 'verlauf'].includes(teile[0]) ? teile[0] : 'projekte')));
  try {
    if (teile[0] === 'p' && /^\d+$/.test(teile[1])) return await zeigeProjekt(Number(teile[1]), teile[2] || 'logbuch');
    // Alte Links (#/projekte/5) weiterhin auflösen
    if (teile[0] === 'projekte' && /^\d+$/.test(teile[1])) return location.replace('#/p/' + teile[1]);
    if (teile[0] === 'personen') return await zeigePersonen();
    if (teile[0] === 'verlauf') return await zeigeVerlauf();
    if (teile[0] === 'eingang' && teile[1]) return await zeigeEingang(teile[1]);
    return await zeigeProjekte();
  } catch (e) {
    $('#view').innerHTML = `<div class="leer"><p>${esc(e.message)}</p>
      <button onclick="route()">Erneut versuchen</button> <a class="btn hell" href="#/">Zur Projektliste</a></div>`;
  }
}
window.addEventListener('hashchange', route);

function speichereProjektNeu() {

// ============================================================
// PROJEKT LADEN
// ============================================================
async function ladeProjekt(pid) {
  const vorher = (P && P.pid === pid) ? P : null;
  const pd = await api('GET', `/api/projects/${pid}`);
  const sites = pd.sites.slice().sort((a, b) => (a.created_at < b.created_at ? -1 : 1));
  const [bonListe, siteDetails, taskListen, docListen] = await Promise.all([
    api('GET', `/api/receipts?project_id=${pid}`).catch(() => ({ receipts: [] })),
    Promise.all(sites.map(s => api('GET', `/api/sites/${s.id}`))),
    Promise.all(sites.map(s => api('GET', `/api/sites/${s.id}/tasks`))),
    Promise.all(sites.map(s => api('GET', `/api/documents?site_id=${s.id}`))),
  ]);
  const tasks = taskListen.flatMap(r => r.tasks);
  const details = await Promise.all(tasks.map(t => api('GET', `/api/tasks/${t.id}`)));
  const zeiten = [], materialien = [], docs = new Map();
  details.forEach(d => {
    zeiten.push(...d.time_entries);
    materialien.push(...d.materials);
    d.documents.forEach(x => docs.set(x.id, x));
  });
  docListen.forEach(r => r.documents.forEach(x => docs.set(x.id, x)));
  const trades = {};
  siteDetails.forEach((sd, i) => { trades[sites[i].id] = sd.trades; });

  P = {
    pid, project: pd.project, sites, trades, tasks, zeiten, materialien,
    bons: Object.fromEntries((bonListe.receipts || []).map(b => [b.id, b])),
    bonOffen: vorher ? vorher.bonOffen : new Set(),
    docs: [...docs.values()].sort((a, b) => (a.created_at < b.created_at ? 1 : -1)),
    tab: vorher ? vorher.tab : 'logbuch',
    filter: vorher ? vorher.filter : { task: '', art: '', zahlung: '' },
    bereich: vorher && sites.some(s => s.id === vorher.bereich) ? vorher.bereich : null,
  };
}

async function neuLaden() {
  await ladeProjekt(P.pid);
  zeichneProjekt();
}

// --- Nachschlagen ---
const aufgabe = id => P.tasks.find(t => t.id === Number(id));
const bereich = id => P.sites.find(s => s.id === Number(id));
function gewerk(id) {
  for (const liste of Object.values(P.trades)) {
    const t = liste.find(x => x.id === id);
    if (t) return t;
  }
  return null;
}
const mehrereBereiche = () => P.sites.length > 1;
function imBereich(taskId) {
  if (!P.bereich) return true;
  const t = aufgabe(taskId);
  return !!t && t.site_id === P.bereich;
}
function docTaskId(d) {
  if (d.task_id) return d.task_id;
  const m = P.materialien.find(x => x.id === d.material_id);
  return m ? m.task_id : null;
}
function docImBereich(d) {
  if (!P.bereich) return true;
  if (d.site_id) return d.site_id === P.bereich;
  return imBereich(docTaskId(d));
}
function aufgabenSortiert() {
  const rang = { 'in Arbeit': 0, 'offen': 1, 'fertig': 2 };
  return P.tasks.filter(t => !P.bereich || t.site_id === P.bereich)
    .sort((a, b) => (rang[a.status] - rang[b.status]) || (a.created_at < b.created_at ? 1 : -1));
}
function aufgabeName(taskId) {
  const t = aufgabe(taskId);
  if (!t) return '–';
  return (mehrereBereiche() ? (bereich(t.site_id)?.name || '') + ' · ' : '') + t.title;
}

// Alle Stunden- und Materialeinträge als ein gemeinsames, nach Datum sortiertes Logbuch
function eintraege() {
  const z = P.zeiten.map(e => ({
    art: 'zeit', id: e.id, task_id: e.task_id, ts: e.created_at,
    datum: e.work_date || lokalesDatum(e.created_at),
    betrag: r2(e.hours * e.hourly_rate + (e.travel_cost || 0)), anfahrt: e.travel_cost || 0,
    billed: e.billed, paid: e.paid, roh: e,
    gezahlt: e.paid ? r2(e.hours * e.hourly_rate + (e.travel_cost || 0)) : r2(e.paid_amount || 0),
  }));
  const m = P.materialien.map(x => ({
    art: 'material', id: x.id, task_id: x.task_id, ts: x.created_at,
    datum: x.purchase_date || lokalesDatum(x.created_at),
    betrag: r2(x.qty * x.unit_price), billed: x.billed, paid: x.paid, roh: x,
    gezahlt: x.paid ? r2(x.qty * x.unit_price) : r2(x.paid_amount || 0),
  }));
  return [...z, ...m]
    .filter(e => imBereich(e.task_id))
    .sort((a, b) => (a.datum < b.datum ? 1 : a.datum > b.datum ? -1 : (a.ts < b.ts ? 1 : -1)));
}

function summen(liste) {
  // arbeit = Stundenlohn inkl. Anfahrt; anfahrt zusätzlich einzeln für die Anzeige
  const s = { gesamt: 0, arbeit: 0, anfahrt: 0, material: 0, stunden: 0, offen: 0, bezahlt: 0, mit: 0, ohne: 0 };
  liste.forEach(e => {
    s.gesamt += e.betrag;
    if (e.art === 'zeit') { s.arbeit += e.betrag; s.stunden += e.roh.hours; s.anfahrt += e.anfahrt; }
    else s.material += e.betrag;
    s.bezahlt += e.gezahlt; s.offen += e.betrag - e.gezahlt;
    if (e.billed) s.mit += e.betrag; else s.ohne += e.betrag;
  });
  Object.keys(s).forEach(k => { s[k] = r2(s[k]); });
  return s;
}

async function zeigeProjekt(pid, tab) {
  if (!['logbuch', 'aufgaben', 'belege', 'auswertung'].includes(tab)) tab = 'logbuch';
  if (!P || P.pid !== pid) {
    $('#view').innerHTML = '<div class="leer">Projekt wird geladen…</div>';
    P = null;
    await ladeProjekt(pid);
  }
  P.tab = tab;
  zeichneProjekt();
}

      <div class="kpi"><div class="zahl">${euro(s.material)}</div><div class="label">Material &amp; Sonstiges</div></div>

function setzeBereich(id) { P.bereich = id; P.filter.task = ''; zeichneProjekt(); }

function zeigeOffene() {
  P.filter = { task: '', art: '', zahlung: 'offen' };
  if (P.tab === 'logbuch') zeichneProjekt();
  else location.hash = `#/p/${P.pid}/logbuch`;
}

// ---------------- Logbuch ----------------
function htmlLogbuch(alle) {
  const f = P.filter;
  const liste = alle.filter(e =>
    (!f.task || String(e.task_id) === f.task) &&
    (!f.art || e.art === f.art) &&
    (!f.zahlung || (f.zahlung === 'offen' ? !e.paid : !!e.paid)));
  const aufg = aufgabenSortiert();
  const filterAktiv = f.task || f.art || f.zahlung;

  const filterHTML = alle.length ? `
    <div class="filter">
      <select onchange="setzeFilter('task', this.value)" aria-label="Aufgabe">
        <option value="">Alle Aufgaben</option>
        ${aufg.map(t => `<option value="${t.id}" ${f.task === String(t.id) ? 'selected' : ''}>${esc(aufgabeName(t.id))}</option>`).join('')}
      </select>
      <select onchange="setzeFilter('art', this.value)" aria-label="Art">
        <option value="">Stunden &amp; Material</option>
        <option value="zeit" ${f.art === 'zeit' ? 'selected' : ''}>Nur Stunden</option>
        <option value="material" ${f.art === 'material' ? 'selected' : ''}>Nur Material</option>
      </select>
      <select onchange="setzeFilter('zahlung', this.value)" aria-label="Zahlung">
        <option value="">Bezahlt &amp; offen</option>
        <option value="offen" ${f.zahlung === 'offen' ? 'selected' : ''}>Nur offene</option>
        <option value="bezahlt" ${f.zahlung === 'bezahlt' ? 'selected' : ''}>Nur bezahlte</option>
      </select>
    </div>` : '';

  if (!alle.length) {
    return `<div class="leer"><p>Noch nichts erfasst.</p>
      <p class="muted">Tippe auf <b>+ Stunden</b> oder <b>+ Material</b>, um den ersten Eintrag anzulegen.</p></div>`;
  }
  if (!liste.length) {
    return filterHTML + `<div class="leer"><p>Keine Einträge für diesen Filter.</p>
      <button class="hell" onclick="filterZuruecksetzen()">Filter zurücksetzen</button></div>`;
  }

  const tage = [];
  liste.forEach(e => {
    let tag = tage[tage.length - 1];
    if (!tag || tag.datum !== e.datum) { tag = { datum: e.datum, eintraege: [] }; tage.push(tag); }
    tag.eintraege.push(e);
  });
  const s = summen(liste);

  return filterHTML + (filterAktiv ? `<div class="seitenkopf">
      <span class="muted">${liste.length} Einträge · ${euro(s.gesamt)}${f.zahlung !== 'bezahlt' ? ` · offen ${euro(s.offen)}` : ''}</span>
      <button class="linkbtn" onclick="filterZuruecksetzen()">Filter zurücksetzen</button></div>` : '') +
    tage.map(tag => `
    <div class="tag">
      <div class="tag-kopf"><span>${datumLang(tag.datum)}</span><span>${euro(summen(tag.eintraege).gesamt)}</span></div>
      ${htmlTagEintraege(tag.eintraege)}
    </div>`).join('');
}

// Material-Positionen eines Kassenbons als EINE aufklappbare Zeile zeigen
function htmlTagEintraege(liste) {
  const gruppen = new Map(), out = [];
  liste.forEach(e => {
    const rid = e.art === 'material' && e.roh.receipt_id;
    if (!rid) { out.push(e); return; }
    if (!gruppen.has(rid)) { const g = { bon: true, rid, pos: [] }; gruppen.set(rid, g); out.push(g); }
    gruppen.get(rid).pos.push(e);
  });
  return out.map(e => e.bon ? htmlBon(e) : htmlEintrag(e)).join('');
}

function htmlBon(g) {
  const b = P.bons[g.rid] || {};
  const summe = r2(g.pos.reduce((s, e) => s + e.betrag, 0));
  const gezahlt = r2(g.pos.reduce((s, e) => s + e.gezahlt, 0));
  const alleBezahlt = g.pos.every(e => e.paid);
  const offen = P.bonOffen.has(g.rid);
  const abw = b.total != null && Math.abs(summe - b.total) > 0.02;
  const ohne = g.pos.some(e => !e.billed);
  const unter = [P.tasks.length > 1 ? esc(aufgabeName(g.pos[0].task_id)) : '',
    `${anzahl(g.pos.length, 'Position', 'Positionen')}${offen ? '' : ' – antippen zum Aufklappen'}`,
    abw ? `<span style="color:var(--red)">⚠ weicht vom Bon ab (Bon: ${euro(b.total)})</span>` : '',
    ohne ? '<span style="color:var(--red)">ohne Rechnung</span>' : ''].filter(Boolean).join(' · ');
  return `<div class="eintrag">
    <button class="e-haupt" onclick="bonAufklappen(${g.rid})" aria-expanded="${offen}">
      <span class="e-typ material">Bon</span>
      <span class="e-text"><b>${offen ? '▾' : '▸'} ${esc(b.store || g.pos[0].roh.store || 'Kassenbon')}</b><small>${unter}</small></span>
      <span class="e-betrag">${euro(summe)}</span>
    </button>
    <button class="zahlung ${alleBezahlt ? 'bezahlt' : (gezahlt > 0 ? 'teil' : 'offen')}" onclick="bonBezahlt(${g.rid})"
      title="Ganzen Bon als ${alleBezahlt ? 'offen' : 'bezahlt'} markieren">${alleBezahlt ? '✓ bezahlt' : (gezahlt > 0 ? `<span>teilweise</span><span>${euro(gezahlt)}</span>` : 'offen')}</button>
  </div>${offen ? `<div style="margin:0 0 6px 18px; border-left:3px solid var(--line)">${g.pos.map(htmlEintrag).join('')}
    ${P.docs.filter(d => d.receipt_id === g.rid).length ? `<p class="hinweis" style="margin:6px 8px">Bon-Fotos: ${P.docs.filter(d => d.receipt_id === g.rid)
      .map((d, i) => `<a href="/api/documents/${d.id}/file" target="_blank" rel="noopener">Foto ${i + 1}</a>`).join(' · ')}</p>` : ''}</div>` : ''}`;
}

function bonAufklappen(rid) {
  if (P.bonOffen.has(rid)) P.bonOffen.delete(rid); else P.bonOffen.add(rid);
  zeichneProjekt();
}

async function bonBezahlt(rid) {
  const pos = P.materialien.filter(m => m.receipt_id === rid);
  const neu = pos.every(m => m.paid) ? 0 : 1;
  try {
    for (const m of pos) {
      if (m.paid !== neu || m.paid_amount) {
        await api('PUT', `/api/materials/${m.id}`, { paid: neu, paid_amount: 0 });
        m.paid = neu; m.paid_amount = 0;
      }
    }
    zeichneProjekt();
    showToast(neu ? 'Bon als bezahlt markiert' : 'Bon wieder offen', 'success');
  } catch (err) { showError(err.message); await neuLaden(); }
}

function htmlEintrag(e) {
  let titel, detail;
  if (e.art === 'zeit') {
    titel = `<b>${esc(e.roh.person)}</b> · ${zahl(e.roh.hours)} Std.`;
    detail = `${zahl(e.roh.hours)} × ${euro(e.roh.hourly_rate)}${e.anfahrt ? ` + ${euro(e.anfahrt)} Anfahrt` : ''}`;
  } else {
    titel = `<b>${esc(e.roh.name)}</b>`;
    detail = `${zahl(e.roh.qty)} ${esc(e.roh.unit || '')} × ${euro(e.roh.unit_price)}${e.roh.store ? ' · ' + esc(e.roh.store) : ''}`;
  }
  // Die Aufgabe nur nennen, wenn es mehr als eine gibt — sonst ist sie in jeder Zeile gleich
  const unter = [P.tasks.length > 1 ? esc(aufgabeName(e.task_id)) : '', detail,
    e.billed ? '' : '<span style="color:var(--red)">ohne Rechnung</span>']
    .filter(Boolean).join(' · ');
  return `<div class="eintrag">
    <button class="e-haupt" onclick="${e.art === 'zeit' ? 'formZeit' : 'formMaterial'}(${e.id})">
      <span class="e-typ ${e.art}">${e.art === 'zeit' ? 'Std' : 'Mat'}</span>
      <span class="e-text">${titel}<small>${unter}</small></span>
      <span class="e-betrag">${euro(e.betrag)}</span>
    </button>
    <button class="zahlung ${e.paid ? 'bezahlt' : (e.gezahlt > 0 ? 'teil' : 'offen')}" onclick="umschaltenBezahlt('${e.art}', ${e.id})"
      title="${e.paid ? 'Bezahlt – antippen, um wieder auf offen zu setzen' : (e.gezahlt > 0 ? 'Teilweise bezahlt – antippen für komplett bezahlt' : 'Offen – antippen, wenn bezahlt')}">${e.paid ? '✓ bezahlt' : (e.gezahlt > 0 ? `<span>teilweise</span><span>${euro(e.gezahlt)}</span>` : 'offen')}</button>
  </div>`;
}

function setzeFilter(k, v) { P.filter[k] = v; zeichneProjekt(); }
function filterZuruecksetzen() { P.filter = { task: '', art: '', zahlung: '' }; zeichneProjekt(); }

async function umschaltenBezahlt(art, id) {
  const liste = art === 'zeit' ? P.zeiten : P.materialien;
  const e = liste.find(x => x.id === id);
  if (!e) return;
  const neu = e.paid ? 0 : 1;
  try {
    await api('PUT', art === 'zeit' ? `/api/timeentries/${id}` : `/api/materials/${id}`, { paid: neu });
    e.paid = neu; e.paid_amount = 0;
    zeichneProjekt();
    showToast(neu ? 'Als bezahlt markiert' : 'Wieder als offen markiert', 'success');
  } catch (err) { showError(err.message); }
}

// ---------------- Aufgaben ----------------
function htmlAufgaben() {
  const liste = aufgabenSortiert();
  const kopf = `<div class="seitenkopf">
    <span class="muted">Aufgaben gliedern das Projekt, z. B. „Trockenbau Bad“ oder „Fenstertausch“.</span>
    <button class="klein" onclick="formAufgabe()">+ Aufgabe</button></div>`;
  if (!liste.length) {
    return kopf + `<div class="leer"><p>Noch keine Aufgaben.</p>
      <p class="muted">Eine Aufgabe entsteht auch automatisch, wenn du Stunden oder Material erfasst.</p></div>`;
  }
  return kopf + liste.map(t => {
    const z = P.zeiten.filter(e => e.task_id === t.id);
    const m = P.materialien.filter(e => e.task_id === t.id);
    const std = r2(z.reduce((a, e) => a + e.hours, 0));
    const tr = t.trade_id ? gewerk(t.trade_id) : null;
    const stKlasse = t.status === 'in Arbeit' ? 'inarbeit' : t.status;
    return `<div class="aufgabe ${t.status === 'fertig' ? 'fertig' : ''}">
      <div class="a-text">
        <div class="a-titel">${esc(t.title)}</div>
        <div class="a-meta">
          <button class="status ${stKlasse}" onclick="statusWeiter(${t.id})" title="Status weiterschalten">${esc(t.status)}</button>
          ${tr ? `<span class="badge gewerk">${esc(tr.name)}</span>` : ''}
          ${mehrereBereiche() ? `<span class="badge">${esc(bereich(t.site_id)?.name || '')}</span>` : ''}
        </div>
        ${t.description ? `<div class="muted">${esc(t.description)}</div>` : ''}
        <div class="a-zahlen">${zahl(std)} Std. · ${m.length} Material-Posten</div>
        <div class="a-akt">
          <button class="linkbtn" onclick="aufgabeEintraege(${t.id})">Einträge ansehen →</button>
          <button class="linkbtn" onclick="formAufgabe(${t.id})">Bearbeiten</button>
        </div>
      </div>
      <div class="a-betrag">${euro(t.total_cost)}</div>
    </div>`;
  }).join('');
}

function aufgabeEintraege(id) {
  P.filter = { task: String(id), art: '', zahlung: '' };
  location.hash = `#/p/${P.pid}/logbuch`;
}

async function statusWeiter(id) {
  const t = aufgabe(id);
  const folge = ['offen', 'in Arbeit', 'fertig'];
  const neu = folge[(folge.indexOf(t.status) + 1) % folge.length];
  try {
    await api('PUT', `/api/tasks/${id}`, { status: neu });
    t.status = neu;
    zeichneProjekt();
  } catch (e) { showError(e.message); }
}

// ---------------- Fotos & Belege ----------------
const DOC_TYPEN = { foto: 'Foto', beleg: 'Beleg', rechnung: 'Rechnung' };

function htmlBelege() {
  const docs = P.docs.filter(docImBereich);
  const kopf = `<div class="seitenkopf"><span class="muted">${docs.length} Dateien</span>

  if (!docs.length) {
    return kopf + `<div class="leer"><p>Noch keine Fotos oder Belege.</p>

  }
  return kopf + `<div class="galerie">${docs.map(d => {

    const mat = d.material_id ? P.materialien.find(m => m.id === d.material_id) : null;
    const zu = mat ? 'Material: ' + mat.name : aufgabeName(docTaskId(d));
    const datei = `/api/documents/${d.id}/file`;
    return `<div class="doc">
      <a class="doc-bild" href="${datei}" target="_blank" rel="noopener">

        <div class="doc-name">${esc(d.filename)}</div>

async function anPaperless(id, knopf) {
  knopf.disabled = true;
  knopf.textContent = 'Wird gesendet…';
  try {
    await api('POST', `/api/documents/${id}/paperless`);
    showToast('An Paperless übertragen', 'success');
    await neuLaden();
  } catch (e) {
    showError(e.message);
    knopf.disabled = false;
    knopf.textContent = 'An Paperless';
  }
}

function loescheDoc(id) {
  const d = P.docs.find(x => x.id === id);
  bestaetigen('Datei löschen?', `„${esc(d.filename)}“ wird dauerhaft gelöscht.`, 'Löschen', async () => {
    await api('DELETE', `/api/documents/${id}`);
    closeModal();
    showToast('Datei gelöscht', 'success');
    await neuLaden();
  });
}

// ---------------- Auswertung ----------------
function htmlAuswertung() {
  const alle = eintraege();
  if (!alle.length) return `<div class="leer"><p>Noch keine Kosten erfasst.</p></div>`;
  const z = alle.filter(e => e.art === 'zeit');
  const m = alle.filter(e => e.art === 'material');
  const sz = summen(z), sm = summen(m), sg = summen(alle);
  // Stundenlohn und Anfahrt in der Kostentabelle getrennt ausweisen
  const sl = summen(z.map(e => ({ ...e, betrag: r2(e.betrag - e.anfahrt) })));
  const sf = summen(z.filter(e => e.anfahrt).map(e => ({ ...e, betrag: e.anfahrt })));

  // Nach Person
  const personen = new Map();
  z.forEach(e => {
    const k = e.roh.person;
    const p = personen.get(k) || { name: k, std: 0, anfahrt: 0, kosten: 0, offen: 0, offeneIds: [] };
    p.std += e.roh.hours; p.anfahrt += e.anfahrt; p.kosten += e.betrag;
    if (!e.paid) { p.offen += e.betrag - e.gezahlt; p.offeneIds.push(e.id); }
    personen.set(k, p);
  });
  const pListe = [...personen.values()].sort((a, b) => b.kosten - a.kosten);
  App.offeneJePerson = Object.fromEntries(pListe.map(p => [p.name, p.offeneIds]));

  // Nach Aufgabe
  const aMap = new Map();
  alle.forEach(e => {
    const a = aMap.get(e.task_id) || { id: e.task_id, arbeit: 0, material: 0, gesamt: 0 };
    if (e.art === 'zeit') a.arbeit += e.betrag; else a.material += e.betrag;
    a.gesamt += e.betrag;
    aMap.set(e.task_id, a);
  });
  const aListe = [...aMap.values()].sort((a, b) => b.gesamt - a.gesamt);
  const aMax = Math.max(...aListe.map(a => a.gesamt), 1);

  // Nach Gewerk (nur wenn Gewerke gepflegt sind)
  const gMap = new Map();
  alle.forEach(e => {
    const t = aufgabe(e.task_id);
    const name = t && t.trade_id ? (gewerk(t.trade_id)?.name || '–') : 'ohne Gewerk';
    gMap.set(name, (gMap.get(name) || 0) + e.betrag);
  });
  const gListe = [...gMap.entries()].sort((a, b) => b[1] - a[1]);
  const zeigeGewerke = gListe.some(([n]) => n !== 'ohne Gewerk');

  return `
    <h2 style="margin-top:0">Kosten</h2>
    <div class="scrollx"><table>
      <tr><th></th><th class="r">mit Rechnung</th><th class="r">ohne Rechnung</th><th class="r">Summe</th></tr>
      <tr><td>Arbeit (${zahl(sz.stunden)} Std.)</td><td class="r">${euro(sl.mit)}</td><td class="r">${euro(sl.ohne)}</td><td class="r">${euro(sl.gesamt)}</td></tr>
      ${sf.gesamt ? `<tr><td>Anfahrt</td><td class="r">${euro(sf.mit)}</td><td class="r">${euro(sf.ohne)}</td><td class="r">${euro(sf.gesamt)}</td></tr>` : ''}
      <tr><td>Material &amp; Sonstiges</td><td class="r">${euro(sm.mit)}</td><td class="r">${euro(sm.ohne)}</td><td class="r">${euro(sm.gesamt)}</td></tr>
      <tr class="summenzeile"><td>Gesamt</td><td class="r">${euro(sg.mit)}</td><td class="r">${euro(sg.ohne)}</td><td class="r">${euro(sg.gesamt)}</td></tr>
    </table></div>

    <h2>Zahlungen</h2>
    <div class="scrollx"><table>
      <tr><th></th><th class="r">bezahlt</th><th class="r">noch offen</th></tr>
      <tr><td>Arbeit${sf.gesamt ? ' inkl. Anfahrt' : ''}</td><td class="r">${euro(sz.bezahlt)}</td><td class="r">${euro(sz.offen)}</td></tr>
      <tr><td>Material &amp; Sonstiges</td><td class="r">${euro(sm.bezahlt)}</td><td class="r">${euro(sm.offen)}</td></tr>
      <tr class="summenzeile"><td>Gesamt</td><td class="r">${euro(sg.bezahlt)}</td><td class="r">${euro(sg.offen)}</td></tr>
    </table></div>

    ${pListe.length ? `<h2>Stunden je Person</h2>
    <div class="scrollx"><table>
      <tr><th>Person</th><th class="r">Stunden</th>${sf.gesamt ? '<th class="r">Anfahrt</th>' : ''}<th class="r">Kosten</th><th class="r">offen</th><th></th></tr>
      ${pListe.map(p => `<tr><td>${esc(p.name)}</td><td class="r">${zahl(p.std)}</td>
        ${sf.gesamt ? `<td class="r">${euro(p.anfahrt)}</td>` : ''}<td class="r">${euro(p.kosten)}</td>
        <td class="r">${euro(p.offen)}</td>
        <td class="r">${p.offeneIds.length ? `<button class="linkbtn" data-person="${esc(p.name)}" onclick="personAuszahlung(this.dataset.person)">auszahlen</button>` : '✓'}</td></tr>`).join('')}
    </table></div>` : ''}

    <h2>Kosten je Aufgabe</h2>
    <div class="scrollx"><table>
      <tr><th>Aufgabe</th><th class="r">Arbeit</th><th class="r">Material</th><th class="r">Gesamt</th></tr>
      ${aListe.map(a => `<tr><td>${esc(aufgabeName(a.id))}
          <div class="balken"><div style="width:${Math.round(a.gesamt / aMax * 100)}%"></div></div></td>
        <td class="r">${euro(a.arbeit)}</td><td class="r">${euro(a.material)}</td><td class="r"><b>${euro(a.gesamt)}</b></td></tr>`).join('')}
    </table></div>

    ${zeigeGewerke ? `<h2>Kosten je Gewerk</h2>
    <div class="scrollx"><table>
      ${gListe.map(([n, v]) => `<tr><td>${esc(n)}</td><td class="r">${euro(v)}</td></tr>`).join('')}
    </table></div>` : ''}`;
}

function personRestOffen(name) {
  const ids = (App.offeneJePerson || {})[name] || [];
  const liste = P.zeiten.filter(e => ids.includes(e.id));
  const betrag = r2(liste.reduce((a, e) => a + e.hours * e.hourly_rate + (e.travel_cost || 0) - (e.paid_amount || 0), 0));
  return { ids, betrag };
}

// (Teil-)Auszahlung: Betrag eingeben, wird auf die offenen Einträge verteilt (älteste zuerst)
function personAuszahlung(name) {
  const { ids, betrag } = personRestOffen(name);
  openModal(`${modalKopf('Auszahlung an ' + name)}
    <div class="modal-body">
      <p>Offen: <b>${euro(betrag)}</b> in ${anzahl(ids.length, 'Eintrag', 'Einträgen')}.</p>
      <label for="f-auszahlung">Ausgezahlter Betrag (€)</label>
      <input id="f-auszahlung" inputmode="decimal" value="${zahlEin(betrag)}" autofocus>
      <p class="hinweis" id="f-auszahlung-hinweis"></p>
      <p class="hinweis">Der Betrag wird auf die offenen Tage verteilt – älteste zuerst. Ein Tag, der nur
        zum Teil gedeckt ist, bleibt „teilweise bezahlt“.</p>
    </div>
    <div class="modal-fuss"><button class="hell" onclick="closeModal()">Abbrechen</button>
      <span class="spacer"></span><button class="gruen" id="m-ja">Auszahlung verbuchen</button></div>`);
  const hinweis = () => {
    const v = parseZahl($('#f-auszahlung').value);
    $('#f-auszahlung-hinweis').textContent = !(v > 0) ? '' :
      v > betrag + 0.004 ? `Mehr als offen (${euro(betrag)}).` : `Danach noch offen: ${euro(r2(betrag - v))}`;
  };
  $('#f-auszahlung').oninput = hinweis;
  hinweis();
  $('#m-ja').onclick = () => mitSperre(async () => {
    const v = parseZahl($('#f-auszahlung').value);
    if (!(v > 0)) throw new Error('Bitte einen Betrag über 0 eintragen.');
    if (v > betrag + 0.004) throw new Error(`Das ist mehr als offen (${euro(betrag)}).`);
    const res = await api('POST', `/api/projects/${P.pid}/payout`, { person: name, amount: v });
    closeModal();
    showToast(`${euro(v)} an ${name} verbucht – noch offen ${euro(res.rest_offen)}`, 'success');
    await neuLaden();
  });
}

function personBezahlt(name) {
  const { ids, betrag } = personRestOffen(name);
  openModal(`${modalKopf('Als bezahlt markieren?')}
    <div class="modal-body"><p>${anzahl(ids.length, 'offener Stunden-Eintrag', 'offene Stunden-Einträge')} von <b>${esc(name)}</b>
      über <b>${euro(betrag)}</b> werden als bezahlt markiert.</p></div>
    <div class="modal-fuss"><button class="hell" onclick="closeModal()">Abbrechen</button>
      <span class="spacer"></span><button class="gruen" id="m-ja">Ja, alles bezahlt</button></div>`);
  $('#m-ja').onclick = () => mitSperre(async () => {
    for (const id of ids) await api('PUT', `/api/timeentries/${id}`, { paid: 1 });
    closeModal();
    showToast(`${ids.length} Einträge als bezahlt markiert`, 'success');
    await neuLaden();
  });
}

// AUSWAHL „AUFGABE“ (in den Erfassungs-Formularen)

  const liste = aufgabenSortiert();

    : (liste.length ? String(liste[0].id) : '__neu');

  return `<label for="f-task">Aufgabe</label>
    <select id="f-task" onchange="$('#f-task-neu').classList.toggle('hidden', this.value !== '__neu')">
      ${liste.map(t => `<option value="${t.id}" ${wahl === String(t.id) ? 'selected' : ''}>${esc(aufgabeName(t.id))}${t.status === 'fertig' ? ' (fertig)' : ''}</option>`).join('')}
      <option value="__neu" ${wahl === '__neu' ? 'selected' : ''}>+ Neue Aufgabe anlegen …</option>
    </select>
    <div id="f-task-neu" class="unterfeld ${wahl === '__neu' ? '' : 'hidden'}">
      <input id="f-task-titel" placeholder="Name der Aufgabe, z. B. Trockenbau Bad" value="${liste.length ? '' : 'Allgemein'}">
      ${mehrereBereiche() ? `<select id="f-task-site">${P.sites.map(b =>
        `<option value="${b.id}" ${b.id === bereichWahl ? 'selected' : ''}>Bereich: ${esc(b.name)}</option>`).join('')}</select>` : ''}
    </div>`;
}

function aufgabeFest(taskId) {
  return `<label>Aufgabe</label><div class="fix">${esc(aufgabeName(taskId))}</div>`;
}

// Liefert die Baustelle des Projekts; legt sie an, falls das Projekt (noch) keine hat.
async function bereichId(gewaehlt) {
  if (gewaehlt) return Number(gewaehlt);
  if (P.bereich) return P.bereich;
  if (P.sites.length) return P.sites[0].id;
  const r = await api('POST', '/api/sites', { project_id: P.pid, name: P.project.name });
  return r.id;
}

// Gewählte Aufgabe zurückgeben bzw. neue Aufgabe anlegen
async function aufgabeAusAuswahl() {
  const v = $('#f-task').value;
  if (v !== '__neu') return Number(v);
  const title = $('#f-task-titel').value.trim() || 'Allgemein';
  const sid = await bereichId($('#f-task-site') ? $('#f-task-site').value : null);
  const r = await api('POST', `/api/sites/${sid}/tasks`, { title, status: 'in Arbeit' });
  return r.id;
}

// ============================================================
// FORMULAR: STUNDEN
// ============================================================
function formZeit(id, vorgabe) {
  const e = id ? P.zeiten.find(x => x.id === id) : null;
  const merk = { ...gemerkt(), ...(vorgabe || {}) };
  const personen = App.persons.filter(p => p.active || (e && e.person_id === p.id));

  // Vorauswahl Person: beim Bearbeiten die eingetragene, sonst die zuletzt benutzte
  // (gemerkt oder die des jüngsten Eintrags im Projekt)
  let pWahl;
  const juengster = P.zeiten.filter(x => x.person_id)
    .sort((a, b) => (a.created_at < b.created_at ? 1 : -1))[0];
  if (e) {
    const perName = App.persons.find(p => p.name.toLowerCase() === e.person.toLowerCase());
    pWahl = e.person_id ? String(e.person_id) : (perName ? String(perName.id) : '__text');
  } else if (personen.some(p => String(p.id) === String(merk.person))) {
    pWahl = String(merk.person);
  } else if (juengster && personen.some(p => p.id === juengster.person_id)) {
    pWahl = String(juengster.person_id);
  } else {

// Letzter Anfahrt-Betrag der Person im Projekt — auch aus früheren
// Materialposten „Anfahrt <Name>“, die vor dem Anfahrt-Feld so erfasst wurden.
function letzteAnfahrt(personId) {
  const neuester = liste => liste.sort((a, b) => (a.created_at < b.created_at ? 1 : -1))[0];
  const z = neuester(P.zeiten.filter(x => String(x.person_id) === String(personId) && x.travel_cost > 0));
  if (z) return z.travel_cost;
  const p = App.persons.find(x => String(x.id) === String(personId));
  if (!p) return null;
  const m = neuester(P.materialien.filter(x => x.unit_price > 0 &&
    x.name.toLowerCase().startsWith('anfahrt') && x.name.toLowerCase().includes(p.name.toLowerCase())));
  return m ? m.unit_price : null;
}

function anfahrtVorschlag() {
  const v = letzteAnfahrt($('#f-person').value);
  $('#f-anfahrt-vorschlag').innerHTML = v
    ? `<button type="button" class="chip" onclick="$('#f-anfahrt').value='${zahlEin(v)}'; zeitSumme()">wie zuletzt: ${euro(v)}</button>`
    : '';
}

function personGewechselt() {
  const v = $('#f-person').value;
  $('#f-person-neu').classList.toggle('hidden', v !== '__neu');
  const p = App.persons.find(x => String(x.id) === v);
  if (p) $('#f-satz').value = p.hourly_rate ? zahlEin(p.hourly_rate) : '';
  if (v === '__neu') { $('#f-satz').value = ''; $('#f-person-name').focus(); }
  anfahrtVorschlag();
  zeitSumme();
}

function zeitSumme() {
  const h = parseZahl($('#f-stunden').value), s = parseZahl($('#f-satz').value);
  const a = $('#f-anfahrt').value.trim() ? parseZahl($('#f-anfahrt').value) : 0;
  $('#f-summe').textContent = (h > 0 && s >= 0 && a >= 0) ? euro(r2(h * s + a)) : '–';
}

async function personAnlegen(name, satz) {
  name = (name || '').trim();
  if (!name) throw new Error('Bitte den Namen der neuen Person eingeben.');
  const da = App.persons.find(p => p.name.toLowerCase() === name.toLowerCase());
  if (da) return da.id;
  const r = await api('POST', '/api/persons', { name, hourly_rate: satz >= 0 ? satz : 0 });
  await ladePersonen();
  return r.id;
}

function speichereZeit(id, weiter) {
  return mitSperre(async () => {
    const hours = parseZahl($('#f-stunden').value);
    if (!(hours > 0)) throw new Error('Bitte die Stunden eintragen (mehr als 0).');
    const rate = parseZahl($('#f-satz').value);
    if (!(rate >= 0)) throw new Error('Bitte einen Stundensatz eintragen (0 = unbezahlte Eigenleistung).');
    const anfahrt = $('#f-anfahrt').value.trim() ? parseZahl($('#f-anfahrt').value) : 0;
    if (!(anfahrt >= 0)) throw new Error('Bitte bei der Anfahrt einen Betrag eintragen oder das Feld leer lassen.');
    const body = {
      hours, hourly_rate: rate, travel_cost: anfahrt, billed: segWert('billed'), ...zahlungWerte(),
      work_date: $('#f-datum').value || null,
    };
    const pv = $('#f-person').value;
    if (pv === '__neu') body.person_id = await personAnlegen($('#f-person-name').value, rate);
    else if (pv !== '__text') body.person_id = Number(pv);

    if (id) {
      await api('PUT', `/api/timeentries/${id}`, body);
      closeModal();
      showToast('Gespeichert', 'success');
      await neuLaden();
      return;
    }
    const taskId = await aufgabeAusAuswahl();
    await api('POST', `/api/tasks/${taskId}/timeentries`, body);
    merke({ task: String(taskId), person: String(body.person_id) });
    await neuLaden();
    if (weiter) {
      formZeit(null, { task: String(taskId), datum: body.work_date || heute() });
      showToast(`${zahl(hours)} Std. gespeichert – nächster Eintrag`, 'success');
    } else {
      closeModal();
      showToast(`${zahl(hours)} Std. gespeichert`, 'success');
    }
  });
}

function loescheZeit(id) {
  const e = P.zeiten.find(x => x.id === id);
  bestaetigen('Eintrag löschen?',
    `${esc(e.person)} · ${zahl(e.hours)} Std. (${euro(e.hours * e.hourly_rate + (e.travel_cost || 0))}) wird gelöscht.`, 'Löschen', async () => {
      await api('DELETE', `/api/timeentries/${id}`);
      closeModal();
      showToast('Eintrag gelöscht', 'success');
      await neuLaden();
    });
}

// Verkleinert auf lange Kante 2000 px (JPEG 85 %); EXIF-Drehung wird berücksichtigt.
async function bonVerkleinern(file) {
  let bmp;
  try { bmp = await createImageBitmap(file, { imageOrientation: 'from-image' }); }
  catch { return file; }
  const f = Math.min(1, 2000 / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas');
  c.width = Math.round(bmp.width * f); c.height = Math.round(bmp.height * f);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  return (await new Promise(r => c.toBlob(r, 'image/jpeg', 0.85))) || file;
}

function bonStart(task) {
  Bon.fotos.forEach(f => URL.revokeObjectURL(f.url));
  Bon.fotos = []; Bon.erg = null; Bon.task = task || null;
  bonFotos();
}

  const n = Bon.fotos.length;
  openModal(`${modalKopf('Kassenbon / Rechnung')}

      <span class="spacer"></span>
      <button id="bon-los" onclick="bonAuswerten()" ${n ? '' : 'disabled'}>Auswerten (${n})</button></div>`);
  if (n) modalGeaendert = true;

async function bonFotoNeu(input) {
  for (const file of [...(input.files || [])]) {
    if (Bon.fotos.length >= 10) { showError('Maximal 10 Fotos pro Bon.'); break; }
    if (file.type === 'application/pdf' || /\.pdf$/i.test(file.name || '')) {
      if (file.size > 20 * 1024 * 1024) { showError('PDF ist größer als 20 MB.'); continue; }
      Bon.fotos.push({ blob: file, url: URL.createObjectURL(file), pdf: true, name: file.name || 'rechnung.pdf' });
      continue;
    }
    const blob = await bonVerkleinern(file);
    Bon.fotos.push({ blob, url: URL.createObjectURL(blob) });
  }
  bonFotos();
}
function bonFotoWeg(i) { URL.revokeObjectURL(Bon.fotos[i].url); Bon.fotos.splice(i, 1); bonFotos(); }
function bonVerschieben(i) { [Bon.fotos[i - 1], Bon.fotos[i]] = [Bon.fotos[i], Bon.fotos[i - 1]]; bonFotos(); }

async function bonAuswerten() {
  const knopf = $('#bon-los');
  knopf.disabled = true; knopf.textContent = 'Wird gelesen … (bis 1 Min.)';
  const fd = new FormData();
  Bon.fotos.forEach((f, i) => fd.append('images', f.blob, f.pdf ? `rechnung_${i + 1}.pdf` : `bon_${i + 1}.jpg`));
  try {
    const res = await fetch('/api/receipts/analyze', { method: 'POST', body: fd });
    let json; try { json = await res.json(); } catch { json = {}; }
    if (!res.ok || json.error) throw new Error(json.error || 'Fehler ' + res.status);
    Bon.erg = json.beleg;
    bonPruefen();
  } catch (e) {
    showError(e.message);
    knopf.disabled = false; knopf.textContent = 'Nochmal auswerten';
  }
}

        <input type="checkbox" id="bon-sammel" style="width:auto; min-height:0" onchange="bonSumme()"> Nur als ein Sammelposten buchen</label>

      <label>Rechnung</label>${seg('billed', 1, [[1, 'Mit Rechnung'], [0, 'Ohne Rechnung']])}

// Positionen inkl. anteilig verteiltem Rabatt; Rundungsrest landet auf der größten Zeile,
// damit die Serverprüfung (Summe = Gesamtsumme ±0,02 €) zuverlässig passt.
function bonPositionen() {
  const markt = $('#bon-markt').value.trim(), datum = $('#bon-datum').value;
  const rabatt = -Math.abs(parseZahl($('#bon-rabatt').value) || 0);
  const zeilen = [...document.querySelectorAll('tr[data-bonpos]')];
  const lies = tr => ({ name: tr.querySelector('.bp-name').value.trim(),
                        qty: parseZahl(tr.querySelector('.bp-qty').value),
                        unit: tr.querySelector('.bp-unit').value.trim() || null,
                        unit_price: parseZahl(tr.querySelector('.bp-preis').value) });
  const wert = l => l.reduce((s, p) => s + (p.qty || 0) * (p.unit_price || 0), 0);
  const alle = zeilen.map(lies);
  let pos = zeilen.filter(tr => tr.querySelector('.bp-an').checked).map(lies);
  const teil = pos.length < alle.length;
  const brutto = wert(pos), bruttoAlle = wert(alle);
  // Bei Teilauswahl bekommen die gewaehlten Positionen nur ihren Anteil am Rabatt.
  const rabattAnteil = teil ? (bruttoAlle > 0 ? rabatt * brutto / bruttoAlle : 0) : rabatt;
  const ziel = r2(Math.max(0, brutto + rabattAnteil));
  if ($('#bon-sammel').checked) {
    return { ziel, pos: pos.length ? [{ name: `Einkauf ${markt || ''} ${datum ? datumKurz(datum) : ''}`.replace(/\s+/g, ' ').trim(),
                                         qty: 1, unit: 'Pauschal', unit_price: ziel }] : [] };
  }
  if (rabattAnteil && brutto > 0) {
    const f = ziel / brutto;
    pos = pos.map(p => ({ ...p, unit_price: Math.round(p.unit_price * f * 10000) / 10000 }));
    const rest = r2(ziel - pos.reduce((s, p) => s + r2(p.qty * p.unit_price), 0));
    if (rest && pos.length) {
      const g = pos.reduce((a, p) => (p.qty * p.unit_price > a.qty * a.unit_price ? p : a));
      g.unit_price = Math.round((g.unit_price + rest / g.qty) * 10000) / 10000;
    }
  }
  return { ziel, pos, teil, anzahl: alle.length };
}

function bonSumme() {
  const { ziel, pos, teil, anzahl } = bonPositionen();
  const total = parseZahl($('#bon-total').value);
  $('#bon-summe').textContent = euro(ziel);
  const el = $('#bon-abgleich');
  if (teil) {
    el.style.color = 'var(--grey)';
    el.textContent = `${pos.length} von ${anzahl} Positionen ausgewählt – gebucht werden nur diese: ${euro(ziel)}`
      + (total >= 0 ? ` (ganzer Bon: ${euro(total)})` : '');
    return;
  }
  if (!(total >= 0)) { el.textContent = 'Bitte die Gesamtsumme vom Bon eintragen.'; el.style.color = 'var(--red)'; return; }
  const diff = r2(ziel - total);
  el.style.color = Math.abs(diff) <= 0.02 ? 'var(--green, green)' : 'var(--red)';
  el.textContent = Math.abs(diff) <= 0.02 ? '✓ passt zur Gesamtsumme vom Bon'
    : `Differenz ${euro(diff)} zur Bon-Summe – fehlt eine Zeile zwischen zwei Fotos? Beim Speichern wird nachgefragt.`;
}

function bonBuchen() {
  return mitSperre(async () => {
    const store = $('#bon-markt').value.trim();
    const purchase_date = $('#bon-datum').value;
    if (!store) throw new Error('Bitte den Markt / Händler eintragen.');
    if (!purchase_date) throw new Error('Bitte das Kaufdatum eintragen.');
    const { pos, ziel, teil } = bonPositionen();
    // Teilauswahl: gebucht wird die Summe der gewählten Positionen.
    const bonTotal = parseZahl($('#bon-total').value);
    if (!teil && Math.abs(r2(ziel - (bonTotal || 0))) > 0.02) {
      const ok = confirm(`Die Positionen ergeben ${euro(ziel)}, auf dem Bon stehen `
        + (bonTotal >= 0 ? euro(bonTotal) : 'keine Gesamtsumme') + `.

Trotzdem ${euro(ziel)} buchen?`);
      if (!ok) return;
    }
    // Gebucht wird immer die Summe der gewählten Positionen.
    const total = ziel;
    if (!pos.length) throw new Error('Keine Position ausgewählt.');
    if (pos.some(p => !p.name || !(p.qty > 0) || !(p.unit_price >= 0)))
      throw new Error('Jede Position braucht Bezeichnung, Menge und Preis.');
    const taskId = await aufgabeAusAuswahl();
    merke({ task: String(taskId) });
    const r = await api('POST', `/api/tasks/${taskId}/receipts`, {
      store, purchase_date, total, positions: pos, billed: segWert('billed'), paid: segWert('bonpaid') });
    const fehler = [];
    for (const [i, f] of Bon.fotos.entries()) {
      const fd = new FormData();
      fd.append('file', f.blob, f.pdf ? f.name : `bon_${purchase_date}_${i + 1}.jpg`);
      try {
        const res = await fetch(`/api/receipts/${r.id}/document`, { method: 'POST', body: fd });
        if (!res.ok) fehler.push(`Foto ${i + 1}: Fehler ${res.status}`);
      } catch (e) { fehler.push(`Foto ${i + 1}: ${e.message}`); }
    }
    closeModal();
    showToast(`Bon gebucht: ${pos.length} ${pos.length === 1 ? 'Position' : 'Positionen'}, ${euro(total)}`, 'success');
    fehler.forEach(m => showError('Bon gebucht, aber ' + m));
    Bon.fotos.forEach(f => URL.revokeObjectURL(f.url)); Bon.fotos = [];
    if (Bon.eingang) { api('DELETE', '/api/eingang/' + Bon.eingang).catch(() => {}); Bon.eingang = null; }
    await neuLaden();
  });
}

// VERLAUF (Änderungsprotokoll mit Rückgängig)
// ============================================================
const VERLAUF_TABELLEN = {
  projects: 'Projekt', sites: 'Bereich', trades: 'Gewerk', tasks: 'Aufgabe', time_entries: 'Stunden',
  materials: 'Material', documents: 'Datei', persons: 'Person', guthaben: 'Guthaben',
  guthaben_verbrauch: 'Guthaben-Verrechnung', receipts: 'Kassenbon' };
const VERLAUF_FELDER = { paid: 'bezahlt', paid_amount: 'Teilzahlung', hours: 'Stunden', hourly_rate: 'Stundensatz',
  work_date: 'Datum', billed: 'mit Rechnung', qty: 'Menge', unit_price: 'Preis', name: 'Name', title: 'Titel',
  status: 'Status', travel_cost: 'Anfahrt', store: 'Markt', purchase_date: 'Kaufdatum', person: 'Person', total: 'Summe' };
const VERLAUF_AKTION = { insert: 'angelegt', update: 'geändert', delete: 'gelöscht' };
const Verlauf = { liste: [], filter: '' };

function verlaufWert(k, v) {
  if (v == null || v === '') return '–';
  if (k === 'paid' || k === 'billed') return v ? 'ja' : 'nein';
  if (typeof v === 'number' && /price|rate|amount|cost|total|betrag/.test(k)) return euro(v);
  return String(v);
}
function verlaufTitel(c) {
  const r = c.new || c.old || {};
  return r.name || r.title || r.person || r.store || r.filename || ('#' + c.row_id);
}
function verlaufDetails(c) {
  if (c.action !== 'update') {
    const r = c.new || c.old || {};
    return ['hours', 'hourly_rate', 'work_date', 'qty', 'unit_price', 'paid', 'total', 'purchase_date']
      .filter(k => k in r && r[k] != null).map(k => `${VERLAUF_FELDER[k] || k}: ${esc(verlaufWert(k, r[k]))}`).join(' · ');
  }
  return Object.keys(c.new).filter(k => k !== 'created_at' && JSON.stringify(c.old[k]) !== JSON.stringify(c.new[k]))
    .map(k => `${esc(VERLAUF_FELDER[k] || k)}: <s>${esc(verlaufWert(k, c.old[k]))}</s> → <b>${esc(verlaufWert(k, c.new[k]))}</b>`).join('<br>');
}

async function zeigeVerlauf() {
  document.body.classList.remove('mit-leiste');
  $('#view').innerHTML = '<div class="leer">Lade …</div>';
  const d = await api('GET', '/api/changelog?limit=500');
  Verlauf.liste = d.changes;
  zeichneVerlauf();
}

function zeichneVerlauf() {
  const f = Verlauf.filter.toLowerCase();
  const liste = Verlauf.liste.filter(c => !f || (VERLAUF_TABELLEN[c.tbl] + ' ' + verlaufTitel(c)).toLowerCase().includes(f));
  let tag = '';
  $('#view').innerHTML = `
    <h1>Verlauf</h1>
    <p class="muted">Jede Änderung wird automatisch protokolliert – auch von Hermes. Einzelne Änderungen lassen sich hier rückgängig machen.</p>
    <input placeholder="Filtern, z. B. Robert oder Stunden" value="${esc(Verlauf.filter)}"
      oninput="Verlauf.filter=this.value; zeichneVerlauf(); const i=$('#view input'); i.focus(); i.setSelectionRange(i.value.length,i.value.length)">
    <div style="margin-top:12px">${liste.map(c => {
      const lokal = new Date(c.ts);
      const t = isoDatum(lokal);
      const kopf = t !== tag ? `<h3 style="margin:18px 0 6px">${esc(datumLang(t))}</h3>` : '';
      tag = t;
      return `${kopf}<div class="box" style="padding:10px 12px; margin-bottom:6px; ${c.undone_by ? 'opacity:.55' : ''}">
        <div style="display:flex; gap:8px; justify-content:space-between; align-items:flex-start">
          <div><b>${esc(VERLAUF_TABELLEN[c.tbl] || c.tbl)} ${VERLAUF_AKTION[c.action]}</b>: ${esc(verlaufTitel(c))}
            <div class="hinweis">${lokal.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' })} Uhr · ${esc(c.quelle || 'direkt in der Datenbank')}${c.undone_by ? ' · rückgängig gemacht' : ''}</div>
            <div style="font-size:13px; margin-top:4px">${verlaufDetails(c)}</div></div>
          ${c.undone_by ? '' : `<button class="hell klein" onclick="verlaufUndo(${c.id})">Rückgängig</button>`}
        </div></div>`;
    }).join('') || '<div class="leer">Noch keine Änderungen protokolliert.</div>'}</div>`;
}

function verlaufUndo(id) {
  const c = Verlauf.liste.find(x => x.id === id);
  bestaetigen('Änderung rückgängig machen?',
    `${esc(VERLAUF_TABELLEN[c.tbl] || c.tbl)} „${esc(verlaufTitel(c))}“ (${VERLAUF_AKTION[c.action]}) wird zurückgesetzt. Auch das wird protokolliert.`,
    'Rückgängig', async () => {
      await api('POST', `/api/changelog/${id}/undo`);
      closeModal();
      showToast('Rückgängig gemacht', 'success');

      <button onclick="formPerson()"><span class="plus">+</span> Neue Person</button>
    </div>
    ${liste.length ? liste.map(p => `
      <div class="person ${p.active ? '' : 'inaktiv'}">
        <div style="flex:1;min-width:0">
          <b>${esc(p.name)}</b>${p.active ? '' : ' <span class="badge">inaktiv</span>'}
          <div class="muted">${euro(p.hourly_rate)} / Std.${p.note ? ' · ' + esc(p.note) : ''}</div>
          <div class="muted">${zahl(p.sum_hours)} Std. erfasst · ${euro(p.sum_cost)}</div>
        </div>
        <button class="hell klein" onclick="formPerson(${p.id})">Bearbeiten</button>
      </div>`).join('')
    : `<div class="leer"><p>Noch keine Personen.</p><button onclick="formPerson()">+ Person anlegen</button></div>`}`;
}

function formPerson(id) {
  const p = id ? App.persons.find(x => x.id === id) : null;
  openModal(`${modalKopf(p ? 'Person bearbeiten' : 'Neue Person')}
    <div class="modal-body">
      <label for="f-pname">Name</label>
      <input id="f-pname" value="${esc(p ? p.name : '')}" autofocus>
      <label for="f-psatz">Stundensatz (€)</label>
      <input id="f-psatz" inputmode="decimal" value="${p ? zahlEin(p.hourly_rate) : ''}" placeholder="z. B. 20">
      <label for="f-pnotiz">Notiz (optional)</label>
      <input id="f-pnotiz" value="${esc(p ? (p.note || '') : '')}" placeholder="z. B. Externer Arbeiter">
      ${p ? `<label>Status</label>${seg('aktiv', p.active, [[1, 'Aktiv'], [0, 'Inaktiv (nicht mehr auswählbar)']])}` : ''}
    </div>
    <div class="modal-fuss">
      ${p ? `<button class="rot" onclick="loeschePerson(${p.id})">Löschen</button>` : ''}
      <span class="spacer"></span>
      <button class="hell" onclick="closeModal()">Abbrechen</button>
      <button onclick="speicherePerson(${p ? p.id : 'null'})">Speichern</button>
    </div>`);
}

function speicherePerson(id) {
  return mitSperre(async () => {
    const name = $('#f-pname').value.trim();
    if (!name) throw new Error('Bitte einen Namen eingeben.');
    const satz = $('#f-psatz').value.trim() ? parseZahl($('#f-psatz').value) : 0;
    if (!(satz >= 0)) throw new Error('Bitte einen gültigen Stundensatz eingeben.');
    const body = { name, hourly_rate: satz, note: $('#f-pnotiz').value.trim() || null };
    if (id) await api('PUT', `/api/persons/${id}`, { ...body, active: segWert('aktiv') });
    else await api('POST', '/api/persons', body);
    closeModal();
    showToast('Person gespeichert', 'success');
    await zeigePersonen();
  });
}

function loeschePerson(id) {
  const p = App.persons.find(x => x.id === id);
  if (p.entry_count > 0) {
    showError(`${p.name} hat bereits Stunden-Einträge und kann nicht gelöscht werden. Stattdessen auf „Inaktiv“ setzen.`);
    return;
  }
  bestaetigen('Person löschen?', `„${esc(p.name)}“ wird gelöscht.`, 'Löschen', async () => {
    await api('DELETE', `/api/persons/${id}`);
    closeModal();
    showToast('Person gelöscht', 'success');
    await zeigePersonen();
  });
}
