<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Baulog · Hyper WorkWise</title>
  <style>
    :root { --ink:#1A1A1A; --grey:#5C5C5C; --line:#CFCFCB; --fill:#F4F4F2;
            --green:#2E7D5B; --hellgruen:#8ECDB0; --red:#B23A3A; --amber:#B07D10; }
    * { box-sizing: border-box; }
    html, body { overflow-x: hidden; }
    body { font-family: Arial, "Liberation Sans", sans-serif; color: var(--ink);
           margin: 0; background: #fafafa; padding-bottom: 64px; }
    @media (min-width:640px) { body { padding-bottom: 0; } }
    .topnav { background: var(--ink); color: #fff; position: sticky; top: 0; z-index: 40; }
    .topnav-innen { max-width: 1100px; margin: 0 auto; padding: 10px 16px;
                    display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
    .marke { font-weight: bold; letter-spacing: 2px; font-size: 13px; color: #fff;
             text-decoration: none; }
    .marke span { color: var(--hellgruen); }
    .tabs { display: none; gap: 14px; }
    @media (min-width:640px) { .tabs { display: flex; } }
    .tabs a { color: var(--line); text-decoration: none; font-size: 14px; padding: 4px 2px; }
    .tabs a.aktiv, .tabs a:hover { color: #fff; }
    main { max-width: 1100px; margin: 16px auto; padding: 0 12px; }
    h1 { font-size: 22px; margin: 0 0 16px; }
    h2 { font-size: 16px; margin: 20px 0 8px; }
    .bottomnav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--ink);
                 display: flex; z-index: 40; }
    @media (min-width:640px) { .bottomnav { display: none; } }
    .bottomnav a { flex: 1; text-align: center; padding: 8px 2px 10px; min-height: 52px;
                   font-size: 10px; color: var(--line); text-decoration: none;
                   display: flex; flex-direction: column; justify-content: center; }
    .bottomnav a.aktiv { color: #fff; font-weight: bold; }
    .karten { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
              gap: 10px; margin-bottom: 16px; }
    .karte { background: #fff; border: 1px solid var(--line); padding: 12px 14px; }
    .karte .zahl { font-size: 20px; font-weight: bold; }
    .karte .label { color: var(--grey); font-size: 12px; margin-top: 2px; }
    .karte.ok .zahl { color: var(--green); }
    .karte.warn .zahl { color: var(--red); }
    .box { background: #fff; border: 1px solid var(--line); margin-bottom: 16px; }
    .box-kopf { display: flex; align-items: center; justify-content: space-between; gap: 8px;
                padding: 10px 12px; border-bottom: 1px solid var(--line);
                font-weight: bold; font-size: 14px; }
    .box-inhalt { padding: 12px; }
    .box-pad { padding: 12px; }
    .zeile { padding: 10px 0; border-bottom: 1px solid var(--fill); }
    .zeile:last-child { border-bottom: none; }
    .seitenkopf { display: flex; align-items: center; justify-content: space-between;
                  gap: 8px; margin-bottom: 12px; }
    table { width: 100%; border-collapse: collapse; background: #fff; }
    th { background: #E7E7E3; text-align: left; font-size: 12px; padding: 8px 10px;
         border-bottom: 1px solid var(--line); }
    td { padding: 8px 10px; border-bottom: 1px solid var(--line); font-size: 14px;
         vertical-align: top; }
    td.r, th.r { text-align: right; }
    .badge { display: inline-block; padding: 2px 8px; font-size: 11px;
             border: 1px solid var(--line); background: var(--fill); }
    .badge.offen { border-color: var(--amber); color: var(--amber); background: #fff; }
    .badge.inarbeit { border-color: var(--amber); color: #fff; background: var(--amber); }
    .badge.fertig { border-color: var(--green); color: var(--green); background: #fff; }
    .badge.aktiv { border-color: var(--green); color: var(--green); background: #fff; }
    .badge.abgeschlossen { color: var(--grey); }
    .badge.mit { border-color: var(--green); color: var(--green); background: #fff; }
    .badge.ohne { border-color: var(--red); color: var(--red); background: #fff; }
    button, .btn { font: inherit; font-size: 13px; padding: 6px 12px;
                   border: 1px solid var(--ink); background: var(--ink); color: #fff;
                   cursor: pointer; text-decoration: none; display: inline-flex;
                   align-items: center; justify-content: center; min-height: 40px; }
    @media (max-width:639px) { button, .btn { min-height: 44px; } }
    .btn.hell, button.hell { background: #fff; color: var(--ink); border-color: var(--line); }
    .btn.rot, button.rot { background: #fff; color: var(--red); border-color: var(--red); }
    .btn.klein, button.klein { min-height: 32px; padding: 3px 9px; font-size: 12px; }
    input, select, textarea { font: inherit; font-size: 14px; padding: 9px;
                              border: 1px solid var(--line); width: 100%;
                              background: #fff; min-height: 44px; }
    textarea { min-height: 80px; }
    label { font-size: 12px; color: var(--grey); display: block; margin: 10px 0 3px; }
    .muted { color: var(--grey); font-size: 13px; }
    .link { color: var(--green); text-decoration: none; font-weight: bold; }
    .link:hover { text-decoration: underline; }
    .btn-link { background: transparent; border: none; padding: 0; min-height: auto;
                font: inherit; font-size: 13px; color: var(--green); text-decoration: none;
                font-weight: bold; cursor: pointer; }
    .btn-link:hover { text-decoration: underline; }
    .leer { text-align: center; color: var(--grey); padding: 32px 0; font-size: 14px; }
    .balken { background: var(--fill); height: 6px; }
    .balken > div { background: var(--green); height: 6px; }
    .galerie { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
               gap: 10px; }
    .thumb { width: 100%; height: 96px; object-fit: cover; border: 1px solid var(--line);
             display: flex; align-items: center; justify-content: center;
             font-size: 28px; background: var(--fill); }
    .brotkrumen { font-size: 13px; color: var(--grey); margin-bottom: 12px;
                  display: flex; flex-wrap: wrap; gap: 4px; }
    .brotkrumen a { color: var(--green); text-decoration: none; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
    @media (max-width:639px) { .grid2 { grid-template-columns: 1fr; } }
    .aktionen { display: flex; gap: 8px; margin: 12px 0; flex-wrap: wrap; }
    .nur-mobil { display: block; }
    .nur-desktop { display: none; }
    @media (min-width:640px) { .nur-mobil { display: none; } .nur-desktop { display: block; } }
    .scrollx { overflow-x: auto; }
    #modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 50;
                      display: flex; align-items: flex-end; justify-content: center;
                      padding: 8px; }
    @media (min-width:640px) { #modal-backdrop { align-items: center; padding: 16px; } }
    #modal-backdrop.hidden { display: none; }
    #modal-box { background: #fff; border: 1px solid var(--line); width: 100%;
                 max-width: 560px; max-height: 90vh; overflow-y: auto;
                 animation: slidein .15s ease-out; }
    .modal-kopf { display: flex; align-items: center; justify-content: space-between;
                  padding: 12px; border-bottom: 1px solid var(--line); }
    .modal-kopf h2 { margin: 0; font-size: 16px; }
    #toast-container { position: fixed; bottom: 72px; left: 12px; right: 12px; z-index: 60;
                       display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
    @media (min-width:640px) { #toast-container { bottom: 16px; left: auto; right: 16px;
                                                  width: 320px; } }
    .toast { pointer-events: auto; padding: 10px 14px; font-size: 14px; color: #fff;
             background: var(--ink); animation: slidein .2s ease-out; }
    .toast.success { background: var(--green); }
    .toast.error { background: var(--red); }
    .hidden { display: none; }
    @keyframes slidein { from { transform: translateY(100%); opacity: 0; }
                         to { transform: translateY(0); opacity: 1; } }
  </style>
</head>
<body>

<!-- ===== TOP BAR ===== -->
<header class="topnav">
  <div class="topnav-innen">
    <a href="#/" class="marke"><span>∞</span> BAULOG</a>
    <nav class="tabs">
      <a href="#/" data-tab="dashboard">Dashboard</a>
      <a href="#/projekte" data-tab="projekte">Projekte</a>
      <a href="#/baustellen" data-tab="baustellen">Baustellen</a>
      <a href="#/aufgaben" data-tab="aufgaben">Aufgaben</a>
      <a href="#/personen" data-tab="personen">Personen</a>
      <a href="#/dokumente" data-tab="dokumente">Dokumente</a>
    </nav>
  </div>
</header>

<!-- ===== HAUPTINHALT ===== -->
<main id="app">
  <div id="view" class="min-h">
    <div class="leer">Wird geladen…</div>
  </div>
</main>

<!-- ===== BOTTOM NAV (Mobile) ===== -->
<nav class="bottomnav">
  <a href="#/" data-tab="dashboard">Start</a>
  <a href="#/projekte" data-tab="projekte">Projekte</a>
  <a href="#/baustellen" data-tab="baustellen">Baustellen</a>
  <a href="#/aufgaben" data-tab="aufgaben">Aufgaben</a>
  <a href="#/personen" data-tab="personen">Personen</a>
  <a href="#/dokumente" data-tab="dokumente">Docs</a>
</nav>

<!-- ===== MODAL-OVERLAY ===== -->
<div id="modal-backdrop" class="hidden">
  <div id="modal-box"><div id="modal-content"></div></div>
</div>

<!-- ===== TOAST ===== -->
<div id="toast-container"></div>

<script>
'use strict';

// ============================================================
// GLOBALER ZUSTAND
// ============================================================
const State = {
  paperlessEnabled: false,
  projects: [],
  sites: [],
};

// View-lokale Daten-Caches (für Edit-Modals ohne String-Parameter)
const ViewData = {};

// ============================================================
// UTILITIES
// ============================================================

function formatEuro(val) {
  const n = parseFloat(val) || 0;
  return n.toLocaleString('de-DE', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + '\u00a0€';
}

// Menge/Stunden: deutsche Schreibweise, keine Float-Artefakte
// (0.1 + 0.2 wurde sonst als "0.30000000000000004 h" angezeigt).
function formatZahl(val) {
  const n = parseFloat(val);
  if (!isFinite(n)) return '0';
  return n.toLocaleString('de-DE', { maximumFractionDigits: 2 });
}

// ISO-Datum (2026-08-20) als 20.08.2026 anzeigen; ungültige Werte unverändert.
function formatDatum(val) {
  if (!val) return '';
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(val));
  return m ? `${m[3]}.${m[2]}.${m[1]}` : String(val);
}

function esc(str) {
  if (str == null) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

const IC = '';
const SC = '';
const BP = 'btn';
const BS = 'btn hell';
const BD = 'btn rot';

function statusBadge(status) {
  const map = { 'offen': 'offen', 'in Arbeit': 'inarbeit', 'fertig': 'fertig',
                'aktiv': 'aktiv', 'abgeschlossen': 'abgeschlossen' };
  return `<span class="badge ${map[status] || ''}">${esc(status)}</span>`;
}

function billedBadge(billed) {
  return billed
    ? `<span class="badge mit">mit Rechnung</span>`
    : `<span class="badge ohne">ohne Rechnung</span>`;
}

function billedToggleHTML(currentBilled, fnName) {
  const a = currentBilled === 1 ? 'btn' : 'btn hell';
  const b = currentBilled === 0 ? 'btn' : 'btn hell';
  return `<div style="display:inline-flex;">
    <button type="button" onclick="${fnName}(1)" data-billed="1" class="${a}">mit Rechnung</button>
    <button type="button" onclick="${fnName}(0)" data-billed="0" class="${b}">ohne Rechnung</button>
  </div>`;
}

function updateBilledToggle(val) {
  document.querySelectorAll('[data-billed]').forEach(b => {
    b.className = parseInt(b.dataset.billed) === val ? 'btn' : 'btn hell';
  });
}

function emptyState(text) {
  return `<div class="leer">${esc(text)}</div>`;
}

function loadingSpinner() {
  return `<div class="leer">Wird geladen…</div>`;
}

// ============================================================
// TOAST
// ============================================================

function showToast(msg, type) {
  const c = document.getElementById('toast-container');
  const div = document.createElement('div');
  div.className = `toast ${type || ''}`;
  div.textContent = msg;
  c.appendChild(div);
  setTimeout(() => { if (div.parentNode) div.remove(); }, 4000);
}

function showError(msg) { showToast(msg, 'error'); }

// ============================================================
// API HELPER
// ============================================================

async function api(method, path, body) {
  const opts = { method, headers: {} };
  if (body !== undefined) {
    opts.headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(body);
  }
  let res;
  try { res = await fetch(path, opts); }
  catch (e) { throw new Error('Netzwerkfehler: ' + e.message); }
  let json;
  try { json = await res.json(); } catch { json = {}; }
  if (!res.ok || json.error) throw new Error(json.error || 'HTTP ' + res.status);
  return json;
}

async function apiUpload(path, formData) {
  let res;
  try { res = await fetch(path, { method: 'POST', body: formData }); }
  catch (e) { throw new Error('Netzwerkfehler: ' + e.message); }
  let json;
  try { json = await res.json(); } catch { json = {}; }
  if (!res.ok || json.error) throw new Error(json.error || 'HTTP ' + res.status);
  return json;
}

// ============================================================
// MODAL
// ============================================================

function openModal(html) {
  document.getElementById('modal-content').innerHTML = html;
  const bd = document.getElementById('modal-backdrop');
  bd.classList.remove('hidden');
}

function closeModal() {
  document.getElementById('modal-backdrop').classList.add('hidden');
  document.getElementById('modal-content').innerHTML = '';
}

document.getElementById('modal-backdrop').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

function modalHeader(title) {
  return `<div class="modal-kopf"><h2>${esc(title)}</h2>
    <button type="button" onclick="closeModal()" class="btn hell klein" aria-label="Schließen">✕</button></div>`;
}

function formRow(label, inputHTML) {
  return `<div><label>${label}</label>${inputHTML}</div>`;
}

// ============================================================
// ROUTER
// ============================================================

function navigate(hash) { window.location.hash = hash; }

function currentTab() {
  const h = window.location.hash || '#/';
  if (h === '#/' || h === '#' || h === '') return 'dashboard';
  if (h.startsWith('#/projekte') || h.startsWith('#/projekt/')) return 'projekte';
  if (h.startsWith('#/baustellen') || h.startsWith('#/baustelle/')) return 'baustellen';
  if (h.startsWith('#/aufgaben') || h.startsWith('#/aufgabe/')) return 'aufgaben';
  if (h.startsWith('#/personen')) return 'personen';
  if (h.startsWith('#/dokumente')) return 'dokumente';
  return '';
}

function updateNavHighlight() {
  const tab = currentTab();
  document.querySelectorAll('.tabs a, .bottomnav a').forEach(el => {
    el.classList.toggle('aktiv', el.dataset.tab === tab);
  });
}

async function render() {
  updateNavHighlight();
  closeModal();
  const hash = window.location.hash || '#/';
  const view = document.getElementById('view');
  // Query-Teil (?project=1) vor dem Zerlegen abtrennen — sonst landet er im
  // letzten Pfadsegment und KEIN Filter-Link findet seine Route.
  // Die Views lesen die Query selbst aus window.location.hash.
  const noHash = hash.replace(/^#/, '').split('?')[0];
  const parts = noHash.split('/').filter(Boolean);

  try {
    if (!parts.length || (parts.length === 1 && parts[0] === '')) {
      await renderDashboard();
    } else if (parts[0] === 'projekte' && parts.length === 1) {
      await renderProjekte();
    } else if (parts[0] === 'projekt' && parts[1]) {
      await renderProjektDetail(parseInt(parts[1]));
    } else if (parts[0] === 'baustellen' && parts.length === 1) {
      await renderBaustellen();
    } else if (parts[0] === 'baustelle' && parts[1] && parts[2] === 'aufgaben') {
      await renderAufgaben(parseInt(parts[1]));
    } else if (parts[0] === 'baustelle' && parts[1] && parts[2] === 'dokumente') {
      await renderDokumente(parseInt(parts[1]));
    } else if (parts[0] === 'baustelle' && parts[1] && parts.length === 2) {
      await renderBaustelleDetail(parseInt(parts[1]));
    } else if (parts[0] === 'aufgabe' && parts[1]) {
      await renderAufgabeDetail(parseInt(parts[1]));
    } else if (parts[0] === 'aufgaben') {
      await renderAufgabenGesamt();
    } else if (parts[0] === 'dokumente') {
      await renderDokumenteGesamt();
    } else if (parts[0] === 'personen') {
      await renderPersonen();
    } else {
      view.innerHTML = `<p class="leer">Seite nicht gefunden.</p>`;
    }
  } catch (e) {
    view.innerHTML = `<div class="box box-pad" style="border-color:var(--red); color:var(--red);">
      <strong>Fehler:</strong> ${esc(e.message)}</div>`;
  }
}

// ============================================================
// HELPERS: Layout-Bausteine
// ============================================================

function breadcrumb(items) {
  return `<nav class="brotkrumen">
    ${items.map((item, i) => i < items.length - 1
      ? `<a href="${esc(item.href)}">${esc(item.label)}</a><span>›</span>`
      : `<span>${esc(item.label)}</span>`
    ).join('')}
  </nav>`;
}

function costGrid(summary) {
  const s = summary || {};
  function tile(label, mit, ohne) {
    return `<div class="karte">
      <div class="label">${label}</div>
      <div class="zahl">${formatEuro((mit || 0) + (ohne || 0))}</div>
      <div class="muted">mit Rechnung: <b style="color:var(--green)">${formatEuro(mit || 0)}</b></div>
      <div class="muted">ohne Rechnung: <b style="color:var(--red)">${formatEuro(ohne || 0)}</b></div>
    </div>`;
  }
  return `<div class="karten">
    ${tile('Material', s.mat_mit, s.mat_ohne)}
    ${tile('Personal', s.pers_mit, s.pers_ohne)}
    ${tile('Gesamtkosten', (s.mat_mit || 0) + (s.pers_mit || 0), (s.mat_ohne || 0) + (s.pers_ohne || 0))}
  </div>`;
}

function tradeBreakdown(byTrade) {
  if (!byTrade || !byTrade.length) return '';
  const total = byTrade.reduce((s, t) => s + (t.gesamt || 0), 0);
  return `<div class="box"><div class="box-kopf">Aufschlüsselung nach Gewerk</div>
    <div class="box-inhalt">
    ${byTrade.map(t => {
      const pct = total > 0 ? Math.round((t.gesamt || 0) / total * 100) : 0;
      return `<div style="margin-bottom:10px;">
        <div style="display:flex; justify-content:space-between; font-size:14px; margin-bottom:3px;">
          <span>${esc(t.trade_name || '(kein Gewerk)')}</span><span>${formatEuro(t.gesamt || 0)}</span>
        </div>
        <div class="balken"><div style="width:${pct}%"></div></div>
      </div>`;
    }).join('')}
  </div></div>`;
}

// ============================================================
// VIEW: DASHBOARD (#/)
// ============================================================

async function renderDashboard() {
  const view = document.getElementById('view');
  view.innerHTML = loadingSpinner();

  const hash = window.location.hash;
  const qs = hash.includes('?') ? hash.split('?')[1] : '';
  const urlParams = new URLSearchParams(qs);
  const selPid = urlParams.get('pid') ? parseInt(urlParams.get('pid')) : null;
  const selSid = urlParams.get('sid') ? parseInt(urlParams.get('sid')) : null;

  let apiPath = '/api/dashboard';
  const qp = [];
  if (selPid) qp.push('project=' + selPid);
  if (selSid) qp.push('site=' + selSid);
  if (qp.length) apiPath += '?' + qp.join('&');

  const [dashData, projData, sitesData] = await Promise.all([
    api('GET', apiPath),
    api('GET', '/api/projects'),
    api('GET', '/api/sites'),
  ]);
  const d = dashData.dashboard;
  State.projects = projData.projects || [];
  State.sites = sitesData.sites || [];
  const filteredSites = selPid ? State.sites.filter(s => s.project_id === selPid) : State.sites;

  const projOpts = ['<option value="">Alle Projekte</option>',
    ...State.projects.map(p => `<option value="${p.id}" ${selPid === p.id ? 'selected' : ''}>${esc(p.name)}</option>`)
  ].join('');
  const siteOpts = ['<option value="">Alle Baustellen</option>',
    ...filteredSites.map(s => `<option value="${s.id}" ${selSid === s.id ? 'selected' : ''}>${esc(s.name)}</option>`)
  ].join('');

  const k = d.kpis || {};

  const kpiKarten = `<div class="karten">
    <div class="karte"><div class="label">Gesamtkosten</div>
      <div class="zahl">${formatEuro(k.gesamt)}</div></div>
    <div class="karte ok"><div class="label">mit Rechnung</div>
      <div class="zahl">${formatEuro(k.gesamt_mit)}</div></div>
    <div class="karte warn"><div class="label">ohne Rechnung</div>
      <div class="zahl">${formatEuro(k.gesamt_ohne)}</div></div>
    <div class="karte"><div class="label">Offene Aufgaben</div>
      <div class="zahl">${k.offene_aufgaben || 0}</div></div>
    <div class="karte"><div class="label">Aktive Baustellen</div>
      <div class="zahl">${k.aktive_baustellen || 0}</div></div>
  </div>`;

  const siteMax = Math.max(1, ...(d.by_site || []).map(s => s.gesamt || 0));
  const siteBars = (d.by_site || []).length === 0 ? '' :
    `<div class="box"><div class="box-kopf">Kosten je Baustelle</div><div class="box-inhalt">
      ${d.by_site.map(s => `<div style="margin-bottom:10px;">
        <div style="display:flex; justify-content:space-between; font-size:14px; margin-bottom:3px;">
          <a class="link" href="#/baustelle/${s.site_id}">${esc(s.site_name)}</a>
          <span>${formatEuro(s.gesamt)} · ${s.offene_aufgaben} offen</span>
        </div>
        <div class="balken"><div style="width:${Math.round((s.gesamt || 0) / siteMax * 100)}%"></div></div>
      </div>`).join('')}
    </div></div>`;

  const personTabelle = (d.by_person || []).length === 0 ? '' :
    `<div class="box"><div class="box-kopf">Stunden &amp; Kosten je Person</div>
      <div class="scrollx"><table>

async function renderBaustellen() {

  const filtered = filterPid ? State.sites.filter(s => s.project_id === filterPid) : State.sites;

  const projFilter = `<select onchange="baustellenFilter(this.value)" class="${SC}" style="max-width:280px;">

        <div style="display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end;">
          <a href="#/baustelle/${s.id}/aufgaben" class="${BS} klein">Aufgaben</a>
          <button onclick="deleteBaustelle(${s.id})" class="${BD} klein">🗑</button>
        </div>
      </div>
    </div>`).join('');

  const tableRows = filtered.map(s => `
    <tr>
      <td><a href="#/baustelle/${s.id}" class="link">${esc(s.name)}</a></td>
      <td>${esc(s.address||'–')}</td>
      <td>${esc(projName(s))}</td>
      <td>${statusBadge(s.status)}</td>
      <td>${formatEuro(s.total_cost)}</td>
      <td>
        <div style="display:flex; gap:8px; justify-content:flex-end;">
          <a href="#/baustelle/${s.id}/aufgaben" class="${BS} klein">Aufgaben</a>
          <button onclick="deleteBaustelle(${s.id})" class="${BD} klein">🗑</button>
        </div>
      </td>
    </tr>`).join('');

  const inner = filtered.length === 0
    ? emptyState('Keine Baustellen gefunden.')
    : `<div class="nur-mobil box-inhalt">${cards}</div>
       <div class="nur-desktop scrollx">
         <table>
           <thead>
             <tr><th>Name</th><th>Adresse</th><th>Projekt</th><th>Status</th><th>Kosten</th><th></th></tr>
           </thead>
           <tbody>${tableRows}</tbody>
         </table>
       </div>`;

  view.innerHTML = `
    <div class="seitenkopf">
      <h1>Baustellen</h1>
      <button onclick="openNeuBaustelleModal()" class="${BP}">+ Baustelle</button>
    </div>
    ${projFilter}

           <tbody>${zeilen}</tbody>

  view.innerHTML = `

// VIEW: AUFGABEN (#/baustelle/<sid>/aufgaben)
// ============================================================

async function renderAufgaben(sid) {
  const view = document.getElementById('view');
  view.innerHTML = loadingSpinner();

  const qs = window.location.hash.includes('?') ? window.location.hash.split('?')[1] : '';
  const params = new URLSearchParams(qs);
  const filterTrade  = params.get('trade')  || '';
  const filterStatus = params.get('status') || '';

  let apiPath = '/api/sites/' + sid + '/tasks';
  const qp = [];
  if (filterTrade)  qp.push('trade=' + filterTrade);
  if (filterStatus) qp.push('status=' + encodeURIComponent(filterStatus));
  if (qp.length) apiPath += '?' + qp.join('&');

  const [siteData, tasksData, tradesData] = await Promise.all([
    api('GET', '/api/sites/' + sid),
    api('GET', apiPath),
    api('GET', '/api/sites/' + sid + '/trades'),
  ]);
  const site   = siteData.site;
  const tasks  = tasksData.tasks  || [];
  const trades = tradesData.trades || [];

  function tradeName(tid) {
    const t = trades.find(t => t.id === tid);
    return t ? t.name : '–';
  }

  const tradeOpts = '<option value="">Alle Gewerke</option>' +
    trades.map(t => `<option value="${t.id}" ${filterTrade==t.id?'selected':''}>${esc(t.name)}</option>`).join('');
  const statusOpts = '<option value="">Alle Status</option>' +
    ['offen','in Arbeit','fertig'].map(s => `<option value="${s}" ${filterStatus===s?'selected':''}>${s}</option>`).join('');

  const cards = tasks.map(t => `
    <div class="zeile">
      <div style="display:flex; align-items:flex-start; justify-content:space-between; gap:8px;">
        <div>
          <a href="#/aufgabe/${t.id}" class="link">${esc(t.title)}</a>
          <div style="display:flex; flex-wrap:wrap; gap:4px; align-items:center;">
            ${statusBadge(t.status)}
            <span class="muted">${esc(tradeName(t.trade_id))}</span>
          </div>
          ${t.total_cost != null ? `<p class="muted">Kosten: ${formatEuro(t.total_cost)}</p>` : ''}
        </div>
        <a href="#/aufgabe/${t.id}" class="${BS} klein" style="flex-shrink:0;">Detail</a>
      </div>
    </div>`).join('');

  const tableRows = tasks.map(t => `
    <tr>
      <td><a href="#/aufgabe/${t.id}" class="link">${esc(t.title)}</a></td>
      <td>${esc(tradeName(t.trade_id))}</td>
      <td>${statusBadge(t.status)}</td>
      <td>${t.total_cost != null ? formatEuro(t.total_cost) : '–'}</td>
      <td><a href="#/aufgabe/${t.id}" class="${BS} klein">Detail</a></td>
    </tr>`).join('');

  const inner = tasks.length === 0
    ? emptyState('Keine Aufgaben gefunden.')
    : `<div class="nur-mobil box-inhalt">${cards}</div>
       <div class="nur-desktop scrollx">
         <table>
           <thead>
             <tr><th>Titel</th><th>Gewerk</th><th>Status</th><th>Kosten</th><th></th></tr>
           </thead>
           <tbody>${tableRows}</tbody>
         </table>
       </div>`;

  view.innerHTML = `
    ${breadcrumb([{label:'Baustellen',href:'#/baustellen'},{label:site.name,href:'#/baustelle/'+sid},{label:'Aufgaben'}])}
    <div class="seitenkopf">
      <h1>Aufgaben</h1>
      <button onclick="openNeuAufgabeModal(${sid})" class="${BP}">+ Aufgabe</button>
    </div>
    <div class="aktionen">
      <select onchange="aufgabenFilter(${sid},'trade',this.value)" class="${SC}" style="max-width:180px;">${tradeOpts}</select>
      <select onchange="aufgabenFilter(${sid},'status',this.value)" class="${SC}" style="max-width:160px;">${statusOpts}</select>
    </div>
    <div class="box">${inner}</div>`;
}

window.aufgabenFilter = function(sid, key, val) {
  const qs = window.location.hash.includes('?') ? window.location.hash.split('?')[1] : '';
  const p  = new URLSearchParams(qs);
  if (val) p.set(key, val); else p.delete(key);
  const s = p.toString();
  window.location.hash = '#/baustelle/' + sid + '/aufgaben' + (s ? '?' + s : '');
};

// ============================================================
// VIEW: AUFGABE DETAIL (#/aufgabe/<id>)
// ============================================================

async function renderAufgabeDetail(taskId) {
  const view = document.getElementById('view');
  view.innerHTML = loadingSpinner();

  const data = await api('GET', '/api/tasks/' + taskId);
  const task  = data.task;
  const times = data.time_entries || [];
  const mats  = data.materials    || [];
  const docs  = data.documents    || [];
  const kosten = data.kosten      || {};

  let trades = [];
  try {
    const td = await api('GET', '/api/sites/' + task.site_id + '/trades');
    trades = td.trades || [];
  } catch {}

  function tradeName(tid) {
    const t = trades.find(t => t.id === tid);
    return t ? t.name : (tid ? 'Gewerk #' + tid : '–');
  }

  // --- Zeiteinträge ---
  const timeCards = times.map(e => `
    <div class="zeile">
      <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:8px;">
        <div>
          <span style="font-weight:bold;">${esc(e.person)}</span>
          ${e.work_date ? `<span class="muted">${esc(formatDatum(e.work_date))}</span>` : ''}
          <p class="muted">${formatZahl(e.hours)} h × ${formatEuro(e.hourly_rate)}/h = <span style="font-weight:bold;">${formatEuro(e.kosten)}</span></p>
          <div>${billedBadge(e.billed)}</div>
        </div>
        <div style="display:flex; gap:4px; flex-shrink:0;">
          <button onclick="openEditTimeEntry(${e.id},${taskId})" class="${BS} klein">✏️</button>
          <button onclick="deleteTimeEntry(${e.id},${taskId})" class="${BD} klein">🗑</button>
        </div>
      </div>
    </div>`).join('');

  const timeTable = `<div class="nur-desktop scrollx">
    <table>
      <thead>
        <tr><th>Person</th><th>Datum</th>
          <th class="r">Stunden</th><th class="r">Satz</th>
          <th class="r">Kosten</th><th>Rechnung</th><th></th></tr>
      </thead>
      <tbody>
        ${times.map(e => `<tr>
          <td>${esc(e.person)}</td>
          <td>${esc(e.work_date ? formatDatum(e.work_date) : '–')}</td>
          <td class="r">${formatZahl(e.hours)}</td>
          <td class="r">${formatEuro(e.hourly_rate)}</td>
          <td class="r">${formatEuro(e.kosten)}</td>
          <td>${billedBadge(e.billed)}</td>
          <td><div style="display:flex; gap:4px; justify-content:flex-end;">
            <button onclick="openEditTimeEntry(${e.id},${taskId})" class="${BS} klein">✏️</button>
            <button onclick="deleteTimeEntry(${e.id},${taskId})" class="${BD} klein">🗑</button>
          </div></td>
        </tr>`).join('')}
      </tbody>
    </table>
  </div>`;

  const timeHTML = times.length === 0
    ? `<p class="muted">Noch keine Zeiteinträge.</p>`
    : `<div class="nur-mobil">${timeCards}</div>${timeTable}`;

  // --- Material ---
  const matCards = mats.map(m => `
    <div class="zeile">
      <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:8px;">
        <div>
          <span style="font-weight:bold;">${esc(m.name)}</span>
          <p class="muted">${formatZahl(m.qty)} ${esc(m.unit||'Stk')} × ${formatEuro(m.unit_price)} = <span style="font-weight:bold;">${formatEuro(m.kosten)}</span></p>
          <div>${billedBadge(m.billed)}</div>
        </div>
        <div style="display:flex; gap:4px; flex-shrink:0;">
          <button onclick="openEditMaterial(${m.id},${taskId})" class="${BS} klein">✏️</button>
          <button onclick="deleteMaterial(${m.id},${taskId})" class="${BD} klein">🗑</button>
        </div>
      </div>
    </div>`).join('');

  const matTable = `<div class="nur-desktop scrollx">
    <table>
      <thead>
        <tr><th>Bezeichnung</th><th class="r">Menge</th>
          <th>Einheit</th><th class="r">Einzelpreis</th>
          <th class="r">Summe</th><th>Rechnung</th><th></th></tr>
      </thead>
      <tbody>
        ${mats.map(m => `<tr>
          <td>${esc(m.name)}</td>
          <td class="r">${formatZahl(m.qty)}</td>
          <td>${esc(m.unit||'Stk')}</td>
          <td class="r">${formatEuro(m.unit_price)}</td>
          <td class="r">${formatEuro(m.kosten)}</td>
          <td>${billedBadge(m.billed)}</td>
          <td><div style="display:flex; gap:4px; justify-content:flex-end;">
            <button onclick="openEditMaterial(${m.id},${taskId})" class="${BS} klein">✏️</button>
            <button onclick="deleteMaterial(${m.id},${taskId})" class="${BD} klein">🗑</button>
          </div></td>
        </tr>`).join('')}
      </tbody>
    </table>
  </div>`;

  const matHTML = mats.length === 0
    ? `<p class="muted">Noch keine Materialpositionen.</p>`
    : `<div class="nur-mobil">${matCards}</div>${matTable}`;

  // --- Dokumente ---
  const docGrid = docs.length === 0
    ? `<p class="muted">Noch keine Dokumente.</p>`
    : `<div class="galerie">
        ${docs.map(d => {
          const isImg = d.mime && d.mime.startsWith('image/');
          const thumb = isImg
            ? `<img src="/api/documents/${d.id}/file" alt="${esc(d.filename)}" loading="lazy" class="thumb">`
            : `<div class="thumb">PDF</div>`;
          const plBtn = d.paperless_url
            ? `<a href="${esc(d.paperless_url)}" target="_blank" rel="noopener" class="badge mit">✓ Paperless</a>`
            : (State.paperlessEnabled ? `<button onclick="sendToPaperless(${d.id},${taskId})" class="btn-link">→ Paperless</button>` : '');
          return `<div style="position:relative;">
            <a href="/api/documents/${d.id}/file" target="_blank" rel="noopener">${thumb}</a>
            <p class="muted" style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;" title="${esc(d.filename)}">${esc(d.filename)}</p>
            <div style="display:flex; flex-wrap:wrap; gap:4px; align-items:center;">${plBtn}</div>
            <button onclick="deleteDoc(${d.id},${taskId})"
              class="btn rot klein" style="position:absolute; top:4px; right:4px;" aria-label="Löschen">✕</button>
          </div>`;
        }).join('')}
      </div>`;

  view.innerHTML = `
    ${breadcrumb([
      {label:'Baustellen',href:'#/baustellen'},
      {label:'Baustelle',href:'#/baustelle/'+task.site_id},
      {label:'Aufgaben',href:'#/baustelle/'+task.site_id+'/aufgaben'},
      {label:task.title}
    ])}

    <div class="box box-pad">
      <div style="display:flex; flex-wrap:wrap; align-items:flex-start; justify-content:space-between; gap:12px;">
        <div>
          <h1>${esc(task.title)}</h1>
          <div style="display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:8px;">
            ${statusBadge(task.status)}
            <span class="muted">${esc(tradeName(task.trade_id))}</span>
          </div>
          ${task.description ? `<p class="muted" style="white-space:pre-wrap;">${esc(task.description)}</p>` : ''}
        </div>
        <button onclick="openEditAufgabeModal(${taskId})" class="${BS}">✏️ Bearbeiten</button>
      </div>

      <div style="display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:16px; border-top:1px solid var(--line); padding-top:12px;">
        <span class="muted">Status:</span>
        ${['offen','in Arbeit','fertig'].map(s =>
          `<button onclick="changeStatus(${taskId},'${s}')"
            class="${task.status === s ? 'btn klein' : 'btn hell klein'}">${s}</button>`
        ).join('')}
      </div>
    </div>

    <div class="karten">
      <div class="karte"><div class="label">Material</div><div class="zahl">${formatEuro(kosten.material)}</div></div>
      <div class="karte"><div class="label">Personal</div><div class="zahl">${formatEuro(kosten.personal)}</div></div>
      <div class="karte ok"><div class="label">Gesamt</div><div class="zahl">${formatEuro(kosten.gesamt)}</div></div>
    </div>

    <div class="box">
      <div class="box-kopf">
        <span>Zeiten (Personal)</span>
        <button onclick="openNeuTimeEntry(${taskId})" class="${BP} klein">+ Zeit erfassen</button>
      </div>
      <div class="box-inhalt">${timeHTML}</div>
    </div>

    <div class="box">
      <div class="box-kopf">
        <span>Material</span>
        <button onclick="openNeuMaterial(${taskId})" class="${BP} klein">+ Materialposition</button>
      </div>
      <div class="box-inhalt">${matHTML}</div>
    </div>

    <div class="box">
      <div class="box-kopf">
        <span>Dokumente &amp; Fotos</span>
        <button onclick="openUploadModal(${taskId},null)" class="${BP} klein">+ Hochladen</button>
      </div>
      <div class="box-inhalt">${docGrid}</div>
    </div>

    <button onclick="deleteAufgabe(${taskId},${task.site_id})" class="${BD}" style="width:100%; margin-top:8px;">Aufgabe löschen</button>`;
}

window.changeStatus = async function(taskId, status) {

    await api('PUT', '/api/tasks/' + taskId, { status });

  } catch(err) { showError(err.message); }

        <option value="in Arbeit" ${task.status==='in Arbeit'?'selected':''}>in Arbeit</option>
        <option value="fertig" ${task.status==='fertig'?'selected':''}>fertig</option>

// ============================================================
// ZEITERFASSUNG MODALS
// ============================================================

let _teBilled = 1;

function _personOpts(persons, selectedId) {
  return persons.map(p =>
    `<option value="${p.id}" data-rate="${p.hourly_rate}"
      ${p.id === selectedId ? 'selected' : ''}>${esc(p.name)} (${formatEuro(p.hourly_rate)}/h)${
        p.active === 0 ? ' – inaktiv' : ''}</option>`
  ).join('');
}

window.tePersonChanged = function() {
  const sel = document.getElementById('mf-te-person-sel');
  const opt = sel.options[sel.selectedIndex];
  if (opt && opt.dataset.rate !== undefined) {
    document.getElementById('mf-te-rate').value = opt.dataset.rate;
  }
};

window.teQuickAddPerson = async function() {
  const name = (document.getElementById('mf-te-neu-name').value || '').trim();
  const rate = parseFloat(document.getElementById('mf-te-neu-rate').value) || 0;
  if (!name) { showError('Name für neue Person fehlt.'); return; }
  try {
    const res = await api('POST', '/api/persons', { name, hourly_rate: rate });
    const d = await api('GET', '/api/persons?active=1');
    ViewData.activePersons = d.persons || [];
    const sel = document.getElementById('mf-te-person-sel');
    if (sel) {
      sel.innerHTML = _personOpts(ViewData.activePersons, res.id);
      tePersonChanged();
    } else {
      // Freitext-Fallback (noch keine Personen vorhanden): kein <select> im Formular,
      // also die neue Person direkt ins Freitextfeld übernehmen statt abzustürzen.
      const txt = document.getElementById('mf-te-person-txt');
      if (txt) txt.value = name;
    }
    document.getElementById('mf-te-neu-name').value = '';
    document.getElementById('mf-te-neu-rate').value = '';
    showToast('Person angelegt.', 'success');
  } catch (err) { showError(err.message); }
};

function _timeEntryFormHTML(entry) {
  // entry = null (neu) oder bestehender Eintrag (bearbeiten)
  const persons = ViewData.activePersons || [];
  const freitextFallback = persons.length === 0 && !entry;
  const personRow = freitextFallback
    ? formRow('Person *', `<input id="mf-te-person-txt" required placeholder="Name">`)
    : formRow('Person *', `
        <select id="mf-te-person-sel" onchange="tePersonChanged()">
          ${entry && !entry.person_id
            ? `<option value="" selected>Freitext: ${esc(entry.person)}</option>` : ''}
          ${_personOpts(persons, entry ? entry.person_id : null)}
        </select>`);
  return `
    ${personRow}
    <div class="zeile">
      <div class="muted" style="margin-bottom:4px;">Schnellanlage neue Person:</div>
      <div style="display:flex; gap:6px;">
        <input id="mf-te-neu-name" placeholder="Name" style="flex:2;">
        <input id="mf-te-neu-rate" type="number" step="0.5" min="0" placeholder="€/h" style="flex:1;">
        <button type="button" onclick="teQuickAddPerson()" class="${BS} klein">+</button>
      </div>
    </div>
    ${formRow('Datum', `<input id="mf-te-date" type="date" value="${entry ? esc(entry.work_date || '') : ''}">`)}
    <div class="grid2">
      ${formRow('Stunden *', `<input id="mf-te-hours" type="number" step="0.25" min="0.25" required value="${entry ? entry.hours : ''}" placeholder="z.B. 8">`)}
      ${formRow('Stundensatz (€/h) *', `<input id="mf-te-rate" type="number" step="0.01" min="0" required value="${entry ? entry.hourly_rate : ''}" placeholder="z.B. 45">`)}
    </div>
    ${formRow('Rechnungs-Flag', billedToggleHTML(entry ? entry.billed : 1, 'setTEBilled'))}`;
}

function _timeEntryPayload() {
  const payload = {
    hours: parseFloat(document.getElementById('mf-te-hours').value),
    hourly_rate: parseFloat(document.getElementById('mf-te-rate').value),
    billed: _teBilled,
    work_date: document.getElementById('mf-te-date').value || null,
  };
  const sel = document.getElementById('mf-te-person-sel');
  if (sel) {
    if (sel.value) payload.person_id = parseInt(sel.value);
    // leerer Wert = "Freitext beibehalten" (nur beim Bearbeiten möglich)
  } else {
    payload.person = document.getElementById('mf-te-person-txt').value.trim();
  }
  return payload;
}

window.setTEBilled = function(val) { _teBilled = val; updateBilledToggle(val); };

window.openNeuTimeEntry = async function(taskId) {
  _teBilled = 1;
  const d = await api('GET', '/api/persons?active=1');
  ViewData.activePersons = d.persons || [];
  openModal(`${modalHeader('Zeit erfassen')}
    <form onsubmit="submitNeuTimeEntry(event,${taskId})" class="box-inhalt">
      ${_timeEntryFormHTML(null)}
      <div class="aktionen">
        <button type="submit" class="${BP}">Speichern</button>
        <button type="button" onclick="closeModal()" class="${BS}">Abbrechen</button>
      </div>
    </form>`);
  tePersonChanged();  // Satz der ersten Person vorbefüllen
};

window.submitNeuTimeEntry = async function(e, taskId) {
  e.preventDefault();
  try {
    await api('POST', '/api/tasks/' + taskId + '/timeentries', _timeEntryPayload());
    showToast('Zeiteintrag gespeichert.', 'success');
    closeModal();
    await renderAufgabeDetail(taskId);
  } catch (err) { showError(err.message); }
};

window.openEditTimeEntry = async function(eid, taskId) {
  const [d, pd] = await Promise.all([
    api('GET', '/api/tasks/' + taskId + '/timeentries'),
    api('GET', '/api/persons'),   // ALLE, siehe unten
  ]);
  const entry = (d.time_entries || []).find(e => e.id === eid);
  if (!entry) { showError('Eintrag nicht gefunden.'); return; }
  // Ist die Person des Eintrags inaktiv, fehlt sie in der Aktiv-Liste; der
  // Browser wählt dann die erste andere Person und "Speichern" hängt den
  // Eintrag stillschweigend um. Darum: aktive Personen + die des Eintrags.
  ViewData.activePersons = (pd.persons || [])
    .filter(p => p.active || p.id === entry.person_id);
  _teBilled = entry.billed;
  openModal(`${modalHeader('Zeiteintrag bearbeiten')}
    <form onsubmit="submitEditTimeEntry(event,${eid},${taskId})" class="box-inhalt">
      ${_timeEntryFormHTML(entry)}
      <div class="aktionen">
        <button type="submit" class="${BP}">Speichern</button>
        <button type="button" onclick="closeModal()" class="${BS}">Abbrechen</button>
      </div>
    </form>`);
};

window.submitEditTimeEntry = async function(e, eid, taskId) {
  e.preventDefault();
  try {
    await api('PUT', '/api/timeentries/' + eid, _timeEntryPayload());
    showToast('Zeiteintrag aktualisiert.', 'success');
    closeModal();
    await renderAufgabeDetail(taskId);
  } catch (err) { showError(err.message); }
};

window.deleteTimeEntry = async function(eid, taskId) {
  if (!confirm('Zeiteintrag löschen?')) return;

// ============================================================
// DOKUMENT-UPLOAD MODAL
// ============================================================

window.openUploadModal = function(taskId, materialId) {
  openModal(`${modalHeader('Dokument / Foto hochladen')}
    <form onsubmit="submitUpload(event,${taskId!=null?taskId:'null'},${materialId!=null?materialId:'null'})" class="box-inhalt">
      ${formRow('Datei * (Bild oder PDF, max. 20 MB)',
        `<input id="mf-ul-file" type="file" accept="image/*,.pdf" capture="environment" required>`)}
      ${formRow('Typ', `<select id="mf-ul-type" class="${SC}">
        <option value="beleg">Beleg</option>
        <option value="rechnung">Rechnung</option>
        <option value="foto">Foto</option>
      </select>`)}
      <div class="aktionen">
        <button type="submit" class="${BP}">Hochladen</button>
        <button type="button" onclick="closeModal()" class="${BS}">Abbrechen</button>
      </div>
    </form>`);
};

window.submitUpload = async function(e, taskId, materialId) {
  e.preventDefault();
  const fi = document.getElementById('mf-ul-file');
  if (!fi.files.length) { showError('Keine Datei ausgewählt.'); return; }
  const fd = new FormData();
  fd.append('file', fi.files[0]);
  fd.append('doc_type', document.getElementById('mf-ul-type').value);
  if (taskId !== null && taskId !== 'null') fd.append('task_id', String(taskId));
  if (materialId !== null && materialId !== 'null') fd.append('material_id', String(materialId));
  try {
    await apiUpload('/api/documents', fd);
    showToast('Dokument hochgeladen.', 'success');
    closeModal();
    const hash = window.location.hash;
    if (hash.startsWith('#/aufgabe/')) {
      await renderAufgabeDetail(parseInt(hash.split('/')[2]));
    } else {
      render();
    }
  } catch(err) { showError(err.message); }
};

window.deleteDoc = async function(docId, taskId) {
  if (!confirm('Dokument löschen?')) return;
  try {
    await api('DELETE', '/api/documents/' + docId);
    showToast('Dokument gelöscht.', 'success');
    if (taskId) await renderAufgabeDetail(taskId);
    else render();
  } catch(err) { showError(err.message); }
};

window.sendToPaperless = async function(docId, taskId) {
  try {
    showToast('Wird an Paperless gesendet…');
    await api('POST', '/api/documents/' + docId + '/paperless');
    showToast('An Paperless gesendet.', 'success');
    if (taskId) await renderAufgabeDetail(taskId);
    else render();
  } catch(err) { showError(err.message); }
};

// ============================================================
// VIEW: DOKUMENTE (#/baustelle/<sid>/dokumente)
// ============================================================

async function renderDokumente(sid) {
  const view = document.getElementById('view');
  view.innerHTML = loadingSpinner();

  const qs = window.location.hash.includes('?') ? window.location.hash.split('?')[1] : '';
  const filterType = new URLSearchParams(qs).get('type') || '';

  let apiPath = '/api/documents?site_id=' + sid;
  if (filterType) apiPath += '&doc_type=' + encodeURIComponent(filterType);

  const [siteData, docsData] = await Promise.all([
    api('GET', '/api/sites/' + sid),
    api('GET', apiPath),
  ]);
  const site = siteData.site;
  const docs = docsData.documents || [];

  const typeFilter = `<div class="aktionen">
    ${['','rechnung','beleg','foto'].map(t => `
      <button onclick="dokTypeFilter(${sid},'${t}')"
        class="${filterType===t ? 'btn klein' : 'btn hell klein'}">
        ${t || 'Alle'}
      </button>`).join('')}
  </div>`;

  const gallery = docs.length === 0
    ? emptyState('Keine Dokumente gefunden.')
    : `<div class="galerie">
        ${docs.map(d => {
          const isImg = d.mime && d.mime.startsWith('image/');
          const thumb = isImg
            ? `<img src="/api/documents/${d.id}/file" alt="${esc(d.filename)}" loading="lazy" class="thumb">`
            : `<div class="thumb">PDF</div>`;
          const plBtn = d.paperless_url
            ? `<a href="${esc(d.paperless_url)}" target="_blank" rel="noopener" class="badge mit">✓ Paperless</a>`
            : (State.paperlessEnabled ? `<button onclick="sendToPaperless(${d.id},null)" class="btn-link">→ Paperless</button>` : '');
          return `<div style="position:relative;">
            <a href="/api/documents/${d.id}/file" target="_blank" rel="noopener">${thumb}</a>
            <p class="muted" style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;" title="${esc(d.filename)}">${esc(d.filename)}</p>
            <div style="display:flex; flex-wrap:wrap; gap:4px; align-items:center;">
              <span class="badge">${esc(d.doc_type||'')}</span>
              ${d.task_id ? `<a href="#/aufgabe/${d.task_id}" class="link">Aufgabe #${d.task_id}</a>` : ''}
              ${plBtn}
            </div>
            <button onclick="deleteDocSite(${d.id},${sid})"
              class="btn rot klein" style="position:absolute; top:4px; right:4px;" aria-label="Löschen">✕</button>
          </div>`;
        }).join('')}
      </div>`;

  view.innerHTML = `
    ${breadcrumb([{label:'Baustellen',href:'#/baustellen'},{label:site.name,href:'#/baustelle/'+sid},{label:'Dokumente'}])}
    <div class="seitenkopf">
      <h1>Dokumente – ${esc(site.name)}</h1>
    </div>
    ${typeFilter}
    <div class="box box-pad">${gallery}</div>`;
}

window.dokTypeFilter = function(sid, type) {
  window.location.hash = '#/baustelle/' + sid + '/dokumente' + (type ? '?type=' + type : '');
};

window.deleteDocSite = async function(docId, sid) {
  if (!confirm('Dokument löschen?')) return;
  try {
    await api('DELETE', '/api/documents/' + docId);
    showToast('Dokument gelöscht.', 'success');
    await renderDokumente(sid);
  } catch(err) { showError(err.message); }
};

// ============================================================
// VIEW: DOKUMENTE GESAMT (#/dokumente)
// ============================================================

async function renderDokumenteGesamt() {
  const view = document.getElementById('view');
  view.innerHTML = `<h1>Dokumente</h1>
    <p class="muted">Bitte eine Baustelle wählen:</p>`;
  const data = await api('GET', '/api/sites');
  const sites = data.sites || [];
  if (!sites.length) { view.innerHTML += emptyState('Noch keine Baustellen angelegt.'); return; }
  view.innerHTML += `<div class="box"><div class="box-inhalt">` + sites.map(s => `
    <a href="#/baustelle/${s.id}/dokumente" class="zeile" style="display:block; text-decoration:none; color:inherit;">
      <span class="link">${esc(s.name)}</span>
      ${s.address ? `<div class="muted">${esc(s.address)}</div>` : ''}
    </a>`).join('') + `</div></div>`;
}

// ============================================================
// INIT
// ============================================================

async function loadConfig() {
  try {
    const d = await api('GET', '/api/config');
    State.paperlessEnabled = !!d.paperless_enabled;
  } catch {}
}

async function loadGlobalCache() {
  try {
    const [pd, sd] = await Promise.all([api('GET','/api/projects'), api('GET','/api/sites')]);
    State.projects = pd.projects || [];
    State.sites    = sd.sites    || [];
  } catch {}
}

window.addEventListener('hashchange', render);

window.addEventListener('load', async () => {
  await loadConfig();
  loadGlobalCache();
  if (!window.location.hash || window.location.hash === '#') {
    window.location.hash = '#/';
  } else {
    render();
  }
});
</script>
