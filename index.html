// ============================================================
(async function start() {
  try {
    const [cfg] = await Promise.all([api('GET', '/api/config'), ladePersonen()]);
    App.paperless = !!cfg.paperless_enabled;
    App.receipts = !!cfg.receipts_enabled;
  } catch (e) { showError(e.message); }
  route();
})();

// ============================================================
// EINSTELLUNGEN: KI für die Kassenbon-Auswertung
// ============================================================
let KI = null;
async function kiEinstellungen() {
  try { KI = await api('GET', '/api/ki-einstellungen'); } catch (e) { return showError(e.message); }
  kiZeichnen(KI.anbieter);
}
function kiZeichnen(anbieter) {
  const a = KI.anbieter_liste.find(x => x.id === anbieter) || KI.anbieter_liste[0];
  const modelle = a.modelle.includes(a.modell) ? a.modelle : [a.modell, ...a.modelle];
  openModal(`${modalKopf('KI für Kassenbons')}
    <div class="modal-body">
      <label>Anbieter</label>
      ${seg('ki-anbieter', a.id, KI.anbieter_liste.map(x => [x.id, x.name]))}
      <label for="ki-modell">Modell</label>
      <input id="ki-modell" list="ki-modelle" value="${esc(a.modell)}" autocomplete="off">
      <datalist id="ki-modelle">${modelle.map(m => `<option value="${esc(m)}">`).join('')}</datalist>
      <p class="hinweis">Aus der Liste wählen oder einen anderen Modellnamen eintippen. Das Modell muss Bilder lesen können.</p>
      <label for="ki-key">API-Key</label>
      <input id="ki-key" type="password" autocomplete="off" placeholder="${a.key ? 'gespeichert (' + esc(a.key) + ') – leer lassen = behalten' : 'Key einfügen'}">
      <p class="hinweis">${a.key ? (a.key_quelle === 'eingetragen' ? 'Key hier eingetragen.' : 'Key kommt aus der Server-Konfiguration.') : 'Noch kein Key vorhanden.'}
        Der Key bleibt auf dem Pi und wird nie wieder angezeigt.</p>
      ${a.key_quelle === 'eingetragen' ? `<label style="display:flex; gap:8px; align-items:center; font-weight:normal">
        <input type="checkbox" id="ki-key-weg" style="width:auto; min-height:0"> Eingetragenen Key löschen</label>` : ''}
      <p class="hinweis" id="ki-test-erg"></p>
    </div>
    <div class="modal-fuss"><button class="hell" onclick="kiSpeichern(true)">Speichern + testen</button>
      <span class="spacer"></span><button onclick="kiSpeichern(false)">Speichern</button></div>`);
  document.querySelectorAll('.seg[data-seg="ki-anbieter"] button').forEach(b =>
    b.addEventListener('click', () => kiZeichnen(b.dataset.v)));
}
function kiSpeichern(testen) {
  return mitSperre(async () => {
    const weg = $('#ki-key-weg');
    KI = await api('PUT', '/api/ki-einstellungen', {
      anbieter: segWert('ki-anbieter'), modell: $('#ki-modell').value.trim(),
      key: $('#ki-key').value.trim(), key_loeschen: !!(weg && weg.checked) });
    try { App.receipts = !!(await api('GET', '/api/config')).receipts_enabled; } catch (e) { /* egal */ }
    if (!testen) { closeModal(); return showToast('KI-Einstellungen gespeichert', 'success'); }
    kiZeichnen(KI.anbieter);
    const el = $('#ki-test-erg');
    el.textContent = 'Teste Verbindung …'; el.style.color = 'var(--grey)';
    try {
      const r = await api('POST', '/api/ki-einstellungen/test');
      el.textContent = '✓ ' + r.meldung; el.style.color = 'var(--green)';
    } catch (e) { el.textContent = '✗ ' + e.message; el.style.color = 'var(--red)'; }
  });
}

// ============================================================
// EINGANG: geteilte Datei (Teilen-Menü → Kurzbefehl) einem Projekt zuordnen
// ============================================================
async function zeigeEingang(eid) {
  $('#view').innerHTML = '<div class="leer">Datei wird geladen…</div>';
  const res = await fetch('/api/eingang/' + encodeURIComponent(eid));
  if (!res.ok) throw new Error('Die geteilte Datei ist nicht mehr vorhanden (wird nach 14 Tagen gelöscht).');
  const name = res.headers.get('X-Dateiname') || 'beleg';
  const blob = await res.blob();
  const pd = await api('GET', '/api/projects');
  $('#view').innerHTML = `<div class="listenkopf"><div><h1>Beleg zuordnen</h1>
      <div class="muted">${esc(name)}</div></div></div>
    <p>Zu welchem Projekt gehört der Beleg?</p>
    ${pd.projects.map(p => `<div class="box" style="padding:12px; cursor:pointer" data-eingang-p="${p.id}">
      <b>${esc(p.name)}</b>${p.description ? `<div class="muted">${esc(p.description)}</div>` : ''}</div>`).join('')
      || '<p class="muted">Noch kein Projekt angelegt.</p>'}
    <button class="hell" onclick="api('DELETE','/api/eingang/${esc(eid)}').finally(() => location.hash = '#/')">Verwerfen</button>`;
  document.querySelectorAll('[data-eingang-p]').forEach(el => el.addEventListener('click', async () => {
    location.hash = '#/p/' + el.dataset.eingangP;
    // warten, bis das Projekt geladen ist, dann direkt die Belegerfassung öffnen
    for (let i = 0; i < 50 && !(P && String(P.pid) === el.dataset.eingangP); i++)
      await new Promise(r => setTimeout(r, 100));
    await new Promise(r => setTimeout(r, 150));
    const pdf = /\.pdf$/i.test(name) || blob.type === 'application/pdf';
    const datei = pdf ? blob : await bonVerkleinern(blob);
    Bon.fotos.forEach(f => URL.revokeObjectURL(f.url));
    Bon.fotos = [{ blob: datei, url: URL.createObjectURL(datei), pdf, name }];
    Bon.erg = null; Bon.task = null; Bon.eingang = eid;
    bonFotos();
  }));
}

// Belege/Fotos in einer Vollbild-Ebene mit Schließen-Knopf zeigen statt die Seite zu verlassen
// (in der Home-Bildschirm-App gibt es keinen Zurück-Knopf).
function belegZeigen(url) {
  const o = document.createElement('div');
  o.id = 'beleg-ansicht';
  o.style.cssText = 'position:fixed;inset:0;z-index:9999;background:#000;display:flex;flex-direction:column';
  o.innerHTML = `<div style="display:flex;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;background:#1A1A1A">
      <button id="beleg-zu" style="font-size:18px;padding:10px 16px">✕ Schließen</button><span class="spacer" style="flex:1"></span>
      <a href="${url}" download style="color:#fff;align-self:center">Speichern</a></div>
    <div style="flex:1;overflow:auto;-webkit-overflow-scrolling:touch;display:flex;justify-content:center;align-items:flex-start">
      <img src="${url}" style="max-width:100%;height:auto;display:block" alt="Beleg"></div>`;
  const zu = () => { o.remove(); window.removeEventListener('popstate', zu); };
  // PDF: alle Seiten als Bilder untereinander (iPhone zeigt eingebettete PDFs nur mit Seite 1)
  o.querySelector('img').onerror = async function () {
    const platz = this.parentNode;
    const m = url.match(/^\/api\/documents\/(\d+)\/file/);
    let n = 0;
    if (m) { try { n = (await api('GET', `/api/documents/${m[1]}/seiten`)).seiten; } catch (e) { n = 0; } }
    if (!n) {
      platz.innerHTML = `<iframe src="${url}" style="width:100%;height:100%;border:0;background:#fff"></iframe>`;
      return;
    }
    platz.style.flexDirection = 'column'; platz.style.alignItems = 'center'; platz.style.justifyContent = 'flex-start';
    platz.innerHTML = Array.from({ length: n }, (_, i) =>
      `<div style="color:#aaa;font-size:13px;margin:10px 0 4px">Seite ${i + 1} von ${n}</div>
       <img src="/api/documents/${m[1]}/seite/${i + 1}" style="width:100%;max-width:1000px;height:auto;display:block;background:#fff" alt="Seite ${i + 1}">`).join('');
  };
  o.querySelector('#beleg-zu').onclick = () => { if (history.state && history.state.beleg) history.back(); else zu(); };
  document.body.appendChild(o);
  history.pushState({ beleg: 1 }, '');
  window.addEventListener('popstate', zu);
}
document.addEventListener('click', ev => {
  const a = ev.target.closest && ev.target.closest('a[href^="/api/documents/"]');
  if (!a || a.hasAttribute('download') || ev.ctrlKey || ev.metaKey) return;
  ev.preventDefault();
  belegZeigen(a.getAttribute('href'));
});
</script>
