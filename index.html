<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Baulog</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html, body { overflow-x: hidden; }
    #modal-backdrop { transition: opacity 0.15s; }
    #app { padding-bottom: 5rem; }
    @media (min-width: 640px) { #app { padding-bottom: 0; } }
    @keyframes slidein { from { transform: translateY(100%); opacity:0; } to { transform: translateY(0); opacity:1; } }
    .toast-enter { animation: slidein 0.2s ease-out; }
  </style>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen">

<!-- ===== TOP BAR ===== -->
<header class="bg-blue-700 text-white shadow-md sticky top-0 z-40">
  <div class="flex items-center justify-between px-4 h-14 max-w-5xl mx-auto">
    <a href="#/" class="text-xl font-bold tracking-tight">🏗 Baulog</a>
    <nav class="hidden sm:flex gap-1 text-sm">
      <a href="#/" data-tab="dashboard" class="nav-tab px-3 py-2 rounded-md font-medium transition">Dashboard</a>
      <a href="#/projekte" data-tab="projekte" class="nav-tab px-3 py-2 rounded-md font-medium transition">Projekte</a>
      <a href="#/baustellen" data-tab="baustellen" class="nav-tab px-3 py-2 rounded-md font-medium transition">Baustellen</a>
      <a href="#/aufgaben" data-tab="aufgaben" class="nav-tab px-3 py-2 rounded-md font-medium transition">Aufgaben</a>
      <a href="#/dokumente" data-tab="dokumente" class="nav-tab px-3 py-2 rounded-md font-medium transition">Dokumente</a>
    </nav>
  </div>
</header>

<!-- ===== HAUPTINHALT ===== -->
<main id="app" class="max-w-5xl mx-auto px-4 py-4 w-full max-w-full break-words">
  <div id="view" class="min-h-[60vh]">
    <div class="flex justify-center items-center h-40">
      <span class="text-gray-400">Wird geladen…</span>
    </div>
  </div>
</main>

<!-- ===== BOTTOM NAV (Mobile) ===== -->
<nav class="sm:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 z-40 flex">
  <a href="#/" data-tab="dashboard" class="bnav-tab flex-1 flex flex-col items-center justify-center py-2 min-h-[56px] text-xs text-gray-600 transition">
    <span class="text-lg">📊</span><span>Dashboard</span>
  </a>
  <a href="#/projekte" data-tab="projekte" class="bnav-tab flex-1 flex flex-col items-center justify-center py-2 min-h-[56px] text-xs text-gray-600 transition">
    <span class="text-lg">📁</span><span>Projekte</span>
  </a>
  <a href="#/baustellen" data-tab="baustellen" class="bnav-tab flex-1 flex flex-col items-center justify-center py-2 min-h-[56px] text-xs text-gray-600 transition">
    <span class="text-lg">🏠</span><span>Baustellen</span>
  </a>
  <a href="#/aufgaben" data-tab="aufgaben" class="bnav-tab flex-1 flex flex-col items-center justify-center py-2 min-h-[56px] text-xs text-gray-600 transition">
    <span class="text-lg">✅</span><span>Aufgaben</span>
  </a>
  <a href="#/dokumente" data-tab="dokumente" class="bnav-tab flex-1 flex flex-col items-center justify-center py-2 min-h-[56px] text-xs text-gray-600 transition">
    <span class="text-lg">📄</span><span>Dokumente</span>
  </a>
</nav>

<!-- ===== MODAL-OVERLAY ===== -->
<div id="modal-backdrop" class="hidden fixed inset-0 bg-black/50 z-50 flex items-end sm:items-center justify-center p-2 sm:p-4">
  <div id="modal-box" class="bg-white rounded-t-2xl sm:rounded-2xl w-full max-w-[95vw] sm:max-w-lg max-h-[90vh] overflow-y-auto shadow-2xl">
    <div id="modal-content"></div>
  </div>
</div>

<!-- ===== TOAST ===== -->
<div id="toast-container" class="fixed bottom-20 sm:bottom-6 left-4 right-4 sm:left-auto sm:right-6 sm:w-80 z-50 flex flex-col gap-2 pointer-events-none"></div>

<script>
'use strict';

// ============================================================
// GLOBALER ZUSTAND
// ============================================================
const State = {
  paperlessEnabled: false,
  projects: [],
  sites: [],
};

// ============================================================
// UTILITIES
// ============================================================

function formatEuro(val) {
  const n = parseFloat(val) || 0;
  return n.toLocaleString('de-DE', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + '\u00a0€';
}

function statusBadge(status) {
  const map = {
    'offen':         'bg-gray-200 text-gray-700',
    'in Arbeit':     'bg-yellow-200 text-yellow-800',
    'fertig':        'bg-green-200 text-green-800',
    'aktiv':         'bg-blue-100 text-blue-800',
    'abgeschlossen': 'bg-purple-100 text-purple-800',
  };
  const cls = map[status] || 'bg-gray-100 text-gray-600';
  return `<span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium ${cls}">${esc(status)}</span>`;
}

function billedBadge(billed) {
  return billed
    ? `<span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium bg-green-100 text-green-800">mit Rechnung</span>`
    : `<span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium bg-orange-100 text-orange-800">ohne Rechnung</span>`;
}

function billedToggleHTML(currentBilled, fnName) {
  const a = currentBilled === 1 ? 'bg-blue-600 text-white' : 'bg-white text-gray-700 hover:bg-gray-100';
  const b = currentBilled === 0 ? 'bg-blue-600 text-white' : 'bg-white text-gray-700 hover:bg-gray-100';
  return `
    <div class="inline-flex rounded-lg border border-gray-300 overflow-hidden">
      <button type="button" onclick="${fnName}(1)" data-billed="1"
        class="px-4 py-2 min-h-[44px] text-sm font-medium transition ${a}">mit Rechnung</button>
      <button type="button" onclick="${fnName}(0)" data-billed="0"
        class="px-4 py-2 min-h-[44px] text-sm font-medium transition border-l border-gray-300 ${b}">ohne Rechnung</button>
    </div>`;
}

function updateBilledToggle(val) {
  document.querySelectorAll('[data-billed]').forEach(b => {
    const isActive = parseInt(b.dataset.billed) === val;
    const base = 'px-4 py-2 min-h-[44px] text-sm font-medium transition';
    const border = b.dataset.billed === '0' ? ' border-l border-gray-300' : '';
    b.className = `${base}${border} ${isActive ? 'bg-blue-600 text-white' : 'bg-white text-gray-700 hover:bg-gray-100'}`;
  });
}

function esc(str) {
  if (str == null) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function emptyState(text) {
  return `<div class="text-center py-12 text-gray-400">
    <div class="text-4xl mb-2">📭</div>
    <p>${esc(text)}</p>
  </div>`;
}

function loadingSpinner() {
  return `<div class="flex justify-center py-12"><div class="animate-spin w-8 h-8 border-4 border-blue-600 border-t-transparent rounded-full"></div></div>`;
}

// ============================================================
// TOAST
// ============================================================

function showToast(msg, type) {
  type = type || 'info';
  const colors = { info: 'bg-blue-600 text-white', success: 'bg-green-600 text-white', error: 'bg-red-600 text-white' };
  const c = document.getElementById('toast-container');
  const div = document.createElement('div');
  div.className = `pointer-events-auto toast-enter rounded-xl shadow-lg px-4 py-3 text-sm ${colors[type] || colors.info}`;
  div.textContent = msg;
  c.appendChild(div);
  setTimeout(() => { if (div.parentNode) div.remove(); }, 4000);
}

function showError(msg) { showToast(msg, 'error'); }

// ============================================================
// API HELPER
// ============================================================

async function api(method, path, body) {
  const opts = { method, headers: {} };
  if (body !== undefined) {
    opts.headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(body);
  }
  let res;
  try { res = await fetch(path, opts); }
  catch (e) { throw new Error('Netzwerkfehler: ' + e.message); }
  let json;
  try { json = await res.json(); } catch { json = {}; }
  if (!res.ok || json.error) throw new Error(json.error || 'HTTP ' + res.status);
  return json;
}

async function apiUpload(path, formData) {
  let res;
  try { res = await fetch(path, { method: 'POST', body: formData }); }
  catch (e) { throw new Error('Netzwerkfehler: ' + e.message); }
  let json;
  try { json = await res.json(); } catch { json = {}; }
  if (!res.ok || json.error) throw new Error(json.error || 'HTTP ' + res.status);
  return json;
}

// ============================================================
// MODAL
// ============================================================

function openModal(html) {
  document.getElementById('modal-content').innerHTML = html;
  const bd = document.getElementById('modal-backdrop');
  bd.classList.remove('hidden');
}

function closeModal() {
  document.getElementById('modal-backdrop').classList.add('hidden');
  document.getElementById('modal-content').innerHTML = '';
}

document.getElementById('modal-backdrop').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

function modalHeader(title) {
  return `<div class="flex items-center justify-between p-4 border-b border-gray-100">
    <h2 class="text-lg font-semibold">${esc(title)}</h2>
    <button onclick="closeModal()" class="w-11 h-11 flex items-center justify-center rounded-full hover:bg-gray-100 text-gray-500 text-xl" aria-label="Schließen">✕</button>
  </div>`;
}

function formRow(label, inputHTML) {
  return `<div class="mb-4"><label class="block text-sm font-medium text-gray-700 mb-1">${label}</label>${inputHTML}</div>`;
}

const IC = 'w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 min-h-[44px]';
const SC = 'w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 min-h-[44px] bg-white';
const BP = 'inline-flex items-center justify-center min-h-[44px] px-4 py-2 bg-blue-600 text-white rounded-lg text-sm font-medium hover:bg-blue-700 transition disabled:opacity-50';
const BS = 'inline-flex items-center justify-center min-h-[44px] px-4 py-2 bg-gray-100 text-gray-700 rounded-lg text-sm font-medium hover:bg-gray-200 transition';
const BD = 'inline-flex items-center justify-center min-h-[44px] px-4 py-2 bg-red-100 text-red-700 rounded-lg text-sm font-medium hover:bg-red-200 transition';

// ============================================================
// ROUTER
// ============================================================

function navigate(hash) { window.location.hash = hash; }

function currentTab() {
  const h = window.location.hash || '#/';
  if (h === '#/' || h === '#' || h === '') return 'dashboard';
  if (h.startsWith('#/projekte') || h.startsWith('#/projekt/')) return 'projekte';
  if (h.startsWith('#/baustellen') || h.startsWith('#/baustelle/')) return 'baustellen';
  if (h.startsWith('#/aufgaben') || h.startsWith('#/aufgabe/')) return 'aufgaben';
  if (h.startsWith('#/dokumente')) return 'dokumente';
  return '';
}

function updateNavHighlight() {
  const tab = currentTab();
  document.querySelectorAll('.nav-tab').forEach(el => {
    const active = el.dataset.tab === tab;
    el.className = `nav-tab px-3 py-2 rounded-md font-medium transition ${active ? 'bg-blue-800 text-white' : 'text-blue-100 hover:bg-blue-600'}`;
  });
  document.querySelectorAll('.bnav-tab').forEach(el => {
    const active = el.dataset.tab === tab;
    el.className = `bnav-tab flex-1 flex flex-col items-center justify-center py-2 min-h-[56px] text-xs transition ${active ? 'text-blue-600 font-semibold' : 'text-gray-500'}`;
  });
}

async function render() {
  updateNavHighlight();
  closeModal();
  const hash = window.location.hash || '#/';
  const view = document.getElementById('view');
  const noHash = hash.replace(/^#/, '');
  const parts = noHash.split('/').filter(Boolean);

  try {
    if (!parts.length || (parts.length === 1 && parts[0] === '')) {
      await renderDashboard();
    } else if (parts[0] === 'projekte' && parts.length === 1) {
      await renderProjekte();
    } else if (parts[0] === 'projekt' && parts[1]) {
      await renderProjektDetail(parseInt(parts[1]));
    } else if (parts[0] === 'baustellen' && parts.length === 1) {
      await renderBaustellen();
    } else if (parts[0] === 'baustelle' && parts[1] && parts[2] === 'aufgaben') {
      await renderAufgaben(parseInt(parts[1]));
    } else if (parts[0] === 'baustelle' && parts[1] && parts[2] === 'dokumente') {
      await renderDokumente(parseInt(parts[1]));
    } else if (parts[0] === 'baustelle' && parts[1] && parts.length === 2) {
      await renderBaustelleDetail(parseInt(parts[1]));
    } else if (parts[0] === 'aufgabe' && parts[1]) {
      await renderAufgabeDetail(parseInt(parts[1]));
    } else if (parts[0] === 'aufgaben') {
      await renderAufgabenGesamt();
    } else if (parts[0] === 'dokumente') {
      await renderDokumenteGesamt();
    } else {
      view.innerHTML = `<p class="text-gray-500 text-center py-12">Seite nicht gefunden.</p>`;
    }
  } catch (e) {
    view.innerHTML = `<div class="bg-red-50 border border-red-200 rounded-xl p-4 text-red-700">
      <strong>Fehler:</strong> ${esc(e.message)}</div>`;
  }
}

// ============================================================
// HELPERS: Layout-Bausteine
// ============================================================

function breadcrumb(items) {
  return `<nav class="flex flex-wrap items-center gap-1 text-sm mb-4 text-gray-500">
    ${items.map((item, i) => i < items.length - 1
      ? `<a href="${esc(item.href)}" class="text-blue-600 hover:underline">${esc(item.label)}</a><span class="mx-1">›</span>`
      : `<span class="text-gray-600">${esc(item.label)}</span>`
    ).join('')}
  </nav>`;
}

function costGrid(summary) {
  const s = summary || {};
  const mm = s.material_mit || 0, mo = s.material_ohne || 0;
  const pm = s.personal_mit || 0, po = s.personal_ohne || 0;
  function tile(label, mit, ohne) {
    const g = mit + ohne;
    return `<div class="bg-gray-50 rounded-xl p-3 border border-gray-100">
      <div class="text-xs font-semibold uppercase text-gray-500 mb-2">${label}</div>
      <div class="space-y-1 text-sm">
        <div class="flex justify-between"><span class="text-gray-500">mit Rechnung</span><span class="font-medium text-green-700">${formatEuro(mit)}</span></div>
        <div class="flex justify-between"><span class="text-gray-500">ohne Rechnung</span><span class="font-medium text-orange-600">${formatEuro(ohne)}</span></div>
        <div class="flex justify-between border-t border-gray-200 pt-1 mt-1"><span class="font-semibold">Gesamt</span><span class="font-bold">${formatEuro(g)}</span></div>
      </div>
    </div>`;
  }
  return `<div class="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-4">
    ${tile('Material', mm, mo)}
    ${tile('Personal', pm, po)}
    ${tile('Gesamtkosten', mm + pm, mo + po)}
  </div>`;
}

function tradeBreakdown(trades) {
  if (!trades || !trades.length) return '';
  const total = trades.reduce((s, t) => s + (t.gesamt || 0), 0);
  return `<div class="bg-white rounded-xl border border-gray-100 p-4 mb-4">
    <h3 class="font-semibold text-sm text-gray-600 mb-3 uppercase">Aufschlüsselung nach Gewerk</h3>
    ${trades.map(t => {
      const pct = total > 0 ? Math.round((t.gesamt || 0) / total * 100) : 0;
      return `<div class="py-2 border-b border-gray-50 last:border-0">
        <div class="flex justify-between text-sm mb-1">
          <span class="font-medium">${esc(t.trade_name || 'Ohne Gewerk')}</span>
          <span>${formatEuro(t.gesamt || 0)}</span>
        </div>
        <div class="w-full bg-gray-100 rounded-full h-1.5">
          <div class="bg-blue-500 h-1.5 rounded-full" style="width:${pct}%"></div>
        </div>
      </div>`;
    }).join('')}
  </div>`;
}

// ============================================================
// VIEW: DASHBOARD (#/)
// ============================================================

async function renderDashboard() {
  const view = document.getElementById('view');
  view.innerHTML = loadingSpinner();

  const hash = window.location.hash;
  const qs = hash.includes('?') ? hash.split('?')[1] : '';
  const urlParams = new URLSearchParams(qs);
  const selPid = urlParams.get('pid') ? parseInt(urlParams.get('pid')) : null;
  const selSid = urlParams.get('sid') ? parseInt(urlParams.get('sid')) : null;

  const [projData, sitesData] = await Promise.all([
    api('GET', '/api/projects'),
    api('GET', '/api/sites'),
  ]);
  State.projects = projData.projects || [];
  State.sites    = sitesData.sites || [];

  const filteredSites = selPid ? State.sites.filter(s => s.project_id === selPid) : State.sites;

  const projOpts = ['<option value="">Alle Projekte</option>',
    ...State.projects.map(p => `<option value="${p.id}" ${selPid === p.id ? 'selected' : ''}>${esc(p.name)}</option>`)
  ].join('');
  const siteOpts = ['<option value="">Alle Baustellen</option>',
    ...filteredSites.map(s => `<option value="${s.id}" ${selSid === s.id ? 'selected' : ''}>${esc(s.name)}</option>`)
  ].join('');

  let summary, summaryTitle;
  if (selSid) {
    const d = await api('GET', `/api/sites/${selSid}/summary`);
    summary = d.summary;
    const site = State.sites.find(s => s.id === selSid);
    summaryTitle = site ? site.name : 'Baustelle #' + selSid;
  } else if (selPid) {
    const d = await api('GET', `/api/projects/${selPid}/summary`);
    summary = d.summary;
    const proj = State.projects.find(p => p.id === selPid);
    summaryTitle = proj ? proj.name : 'Projekt #' + selPid;
  } else {
    const d = await api('GET', '/api/summary');
    summary = d.summary;
    summaryTitle = 'Alle Projekte';
  }

  view.innerHTML = `
    <h1 class="text-xl font-bold mb-4">Dashboard</h1>

    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-4 mb-4">
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Projekt</label>
          <select id="dash-pid" onchange="dashFilter()" class="${SC}">${projOpts}</select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Baustelle</label>
          <select id="dash-sid" onchange="dashFilter()" class="${SC}">${siteOpts}</select>
        </div>
      </div>
    </div>

    <h2 class="font-semibold text-gray-700 mb-2">Kosten: ${esc(summaryTitle)}</h2>
    ${costGrid(summary)}
    ${tradeBreakdown((summary || {}).trades || [])}

    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 mt-4">
      <a href="#/projekte" class="bg-white rounded-xl border border-gray-100 p-4 hover:shadow-md transition block">
        <div class="text-2xl mb-1">📁</div>
        <div class="font-semibold">Projekte</div>
        <div class="text-sm text-gray-500">${State.projects.length} Projekt(e)</div>
      </a>
      <a href="#/baustellen" class="bg-white rounded-xl border border-gray-100 p-4 hover:shadow-md transition block">
        <div class="text-2xl mb-1">🏠</div>
        <div class="font-semibold">Baustellen</div>
        <div class="text-sm text-gray-500">${State.sites.length} Baustelle(n)</div>
      </a>
      <a href="#/aufgaben" class="bg-white rounded-xl border border-gray-100 p-4 hover:shadow-md transition block">
        <div class="text-2xl mb-1">✅</div>
        <div class="font-semibold">Aufgaben</div>
        <div class="text-sm text-gray-500">nach Baustelle</div>
      </a>
    </div>`;
}

window.dashFilter = function() {
  const pid = document.getElementById('dash-pid').value;
  const sid = document.getElementById('dash-sid').value;
  const params = [];
  if (pid) params.push('pid=' + pid);
  if (sid) params.push('sid=' + sid);
  window.location.hash = '#/' + (params.length ? '?' + params.join('&') : '');
};

// ============================================================
// VIEW: PROJEKTE (#/projekte)
// ============================================================

async function renderProjekte() {
  const view = document.getElementById('view');
  view.innerHTML = loadingSpinner();
  const data = await api('GET', '/api/projects');
  const projects = data.projects || [];
  State.projects = projects;

  const cards = projects.map(p => `
    <div class="border-b border-gray-100 py-3 last:border-0">
      <div class="flex items-start justify-between gap-2">
        <div class="min-w-0">
          <a href="#/projekt/${p.id}" class="font-medium text-blue-700 hover:underline break-words">${esc(p.name)}</a>
          ${p.note ? `<p class="text-xs text-gray-400 mt-0.5 break-words">${esc(p.note)}</p>` : ''}
          <p class="text-sm text-gray-500 mt-1">${p.site_count != null ? p.site_count : 0} Baustelle(n) · ${formatEuro(p.total_cost)}</p>
        </div>
        <div class="flex gap-2 shrink-0">
          <button onclick="openEditProjektModal(${p.id},'${esc(p.name)}','${esc(p.note||'')}')" class="${BS} !px-3 !min-h-[44px]" aria-label="Bearbeiten">✏️</button>
          <button onclick="deleteProjekt(${p.id})" class="${BD} !px-3 !min-h-[44px]" aria-label="Löschen">🗑</button>
        </div>
      </div>
    </div>`).join('');

  const tableRows = projects.map(p => `
    <tr class="border-b border-gray-50 hover:bg-gray-50">
      <td class="py-3 px-4"><a href="#/projekt/${p.id}" class="text-blue-700 font-medium hover:underline">${esc(p.name)}</a>
        ${p.note ? `<p class="text-xs text-gray-400">${esc(p.note)}</p>` : ''}</td>
      <td class="py-3 px-4 text-sm text-gray-500">${p.site_count != null ? p.site_count : 0}</td>
      <td class="py-3 px-4 text-sm font-medium">${formatEuro(p.total_cost)}</td>
      <td class="py-3 px-4">
        <div class="flex gap-2 justify-end">
          <button onclick="openEditProjektModal(${p.id},'${esc(p.name)}','${esc(p.note||'')}')" class="${BS} !px-3 !min-h-[44px]">✏️</button>
          <button onclick="deleteProjekt(${p.id})" class="${BD} !px-3 !min-h-[44px]">🗑</button>
        </div>
      </td>
    </tr>`).join('');

  const inner = projects.length === 0 ? emptyState('Noch keine Projekte angelegt.') : `
    <div class="sm:hidden px-4">${cards}</div>
    <div class="hidden sm:block overflow-x-auto">
      <table class="w-full text-left text-sm">
        <thead class="text-xs uppercase text-gray-400 border-b border-gray-100">

async function renderAufgaben(sid) {
  const view = document.getElementById('view');

  const filterStatus = params.get('status') || '';

  let apiPath = '/api/sites/' + sid + '/tasks';
  const qp = [];
  if (filterTrade)  qp.push('trade=' + filterTrade);
  if (filterStatus) qp.push('status=' + encodeURIComponent(filterStatus));
  if (qp.length) apiPath += '?' + qp.join('&');

  const [siteData, tasksData, tradesData] = await Promise.all([
    api('GET', '/api/sites/' + sid),
    api('GET', apiPath),
    api('GET', '/api/sites/' + sid + '/trades'),
  ]);
  const site   = siteData.site;
  const tasks  = tasksData.tasks  || [];
  const trades = tradesData.trades || [];

  function tradeName(tid) {
    const t = trades.find(t => t.id === tid);
    return t ? t.name : '–';
  }

  const tradeOpts = '<option value="">Alle Gewerke</option>' +
    trades.map(t => `<option value="${t.id}" ${filterTrade==t.id?'selected':''}>${esc(t.name)}</option>`).join('');
  const statusOpts = '<option value="">Alle Status</option>' +
    ['offen','in Arbeit','fertig'].map(s => `<option value="${s}" ${filterStatus===s?'selected':''}>${s}</option>`).join('');

  const cards = tasks.map(t => `
    <div class="border-b border-gray-100 py-3 last:border-0">
      <div class="flex items-start justify-between gap-2">
        <div class="min-w-0">
          <a href="#/aufgabe/${t.id}" class="font-medium text-blue-700 hover:underline break-words">${esc(t.title)}</a>
          <div class="flex flex-wrap gap-1 mt-1">
            ${statusBadge(t.status)}
            <span class="text-xs text-gray-400 self-center">${esc(tradeName(t.trade_id))}</span>
          </div>
          ${t.total_cost != null ? `<p class="text-xs text-gray-500 mt-0.5">Kosten: ${formatEuro(t.total_cost)}</p>` : ''}
        </div>
        <a href="#/aufgabe/${t.id}" class="${BS} !px-3 !min-h-[44px] shrink-0 text-xs">Detail</a>
      </div>
    </div>`).join('');

  const tableRows = tasks.map(t => `
    <tr class="border-b border-gray-50 hover:bg-gray-50">
      <td class="py-3 px-4"><a href="#/aufgabe/${t.id}" class="text-blue-700 hover:underline break-words">${esc(t.title)}</a></td>
      <td class="py-3 px-4 text-sm">${esc(tradeName(t.trade_id))}</td>
      <td class="py-3 px-4">${statusBadge(t.status)}</td>
      <td class="py-3 px-4 text-sm">${t.total_cost != null ? formatEuro(t.total_cost) : '–'}</td>
      <td class="py-3 px-4"><a href="#/aufgabe/${t.id}" class="${BS} !px-3 !min-h-[44px] text-xs">Detail</a></td>
    </tr>`).join('');

  const inner = tasks.length === 0
    ? emptyState('Keine Aufgaben gefunden.')
    : `<div class="sm:hidden px-4">${cards}</div>
       <div class="hidden sm:block overflow-x-auto">
         <table class="w-full text-left text-sm">
           <thead class="text-xs uppercase text-gray-400 border-b border-gray-100">
             <tr><th class="py-3 px-4">Titel</th><th class="py-3 px-4">Gewerk</th><th class="py-3 px-4">Status</th><th class="py-3 px-4">Kosten</th><th class="py-3 px-4"></th></tr>
           </thead>
           <tbody>${tableRows}</tbody>
         </table>
       </div>`;

  view.innerHTML = `
    ${breadcrumb([{label:'Baustellen',href:'#/baustellen'},{label:site.name,href:'#/baustelle/'+sid},{label:'Aufgaben'}])}
    <div class="flex items-center justify-between mb-4">
      <h1 class="text-xl font-bold">Aufgaben</h1>
      <button onclick="openNeuAufgabeModal(${sid})" class="${BP}">+ Aufgabe</button>
    </div>
    <div class="flex flex-wrap gap-3 mb-4">
      <select onchange="aufgabenFilter(${sid},'trade',this.value)" class="${SC} max-w-[180px]">${tradeOpts}</select>
      <select onchange="aufgabenFilter(${sid},'status',this.value)" class="${SC} max-w-[160px]">${statusOpts}</select>
    </div>
    <div class="bg-white rounded-xl shadow-sm border border-gray-100">${inner}</div>`;
}

window.aufgabenFilter = function(sid, key, val) {
  const qs = window.location.hash.includes('?') ? window.location.hash.split('?')[1] : '';
  const p  = new URLSearchParams(qs);
  if (val) p.set(key, val); else p.delete(key);
  const s = p.toString();
  window.location.hash = '#/baustelle/' + sid + '/aufgaben' + (s ? '?' + s : '');
};

async function renderAufgabeDetail(taskId) {
  const view = document.getElementById('view');
  view.innerHTML = loadingSpinner();

  const data = await api('GET', '/api/tasks/' + taskId);
  const task  = data.task;
  const times = data.time_entries || [];
  const mats  = data.materials    || [];
  const docs  = data.documents    || [];
  const kosten = data.kosten      || {};

  let trades = [];
  try {
    const td = await api('GET', '/api/sites/' + task.site_id + '/trades');
    trades = td.trades || [];
  } catch {}

  function tradeName(tid) {
    const t = trades.find(t => t.id === tid);
    return t ? t.name : (tid ? 'Gewerk #' + tid : '–');
  }

  // --- Zeiteinträge ---
  const timeCards = times.map(e => `
    <div class="bg-gray-50 rounded-lg p-3">
      <div class="flex justify-between items-start gap-2">
        <div class="min-w-0">
          <span class="font-medium text-sm">${esc(e.person)}</span>
          ${e.work_date ? `<span class="text-xs text-gray-400 ml-2">${esc(e.work_date)}</span>` : ''}
          <p class="text-xs text-gray-500 mt-0.5">${e.hours} h × ${formatEuro(e.hourly_rate)}/h = <span class="font-semibold">${formatEuro(e.kosten)}</span></p>
          <div class="mt-1">${billedBadge(e.billed)}</div>
        </div>
        <div class="flex gap-1 shrink-0">
          <button onclick="openEditTimeEntry(${e.id},${taskId})" class="${BS} !px-2 !min-h-[44px]">✏️</button>
          <button onclick="deleteTimeEntry(${e.id},${taskId})" class="${BD} !px-2 !min-h-[44px]">🗑</button>
        </div>
      </div>
    </div>`).join('');

  const timeTable = `<div class="hidden sm:block overflow-x-auto">
    <table class="w-full text-sm">
      <thead class="text-xs text-gray-400 uppercase border-b border-gray-100">
        <tr><th class="py-2 px-3 text-left">Person</th><th class="py-2 px-3 text-left">Datum</th>
          <th class="py-2 px-3 text-right">Stunden</th><th class="py-2 px-3 text-right">Satz</th>
          <th class="py-2 px-3 text-right">Kosten</th><th class="py-2 px-3 text-left">Rechnung</th><th></th></tr>
      </thead>
      <tbody>
        ${times.map(e => `<tr class="border-b border-gray-50">
          <td class="py-2 px-3">${esc(e.person)}</td>
          <td class="py-2 px-3 text-gray-400">${esc(e.work_date||'–')}</td>
          <td class="py-2 px-3 text-right">${e.hours}</td>
          <td class="py-2 px-3 text-right">${formatEuro(e.hourly_rate)}</td>
          <td class="py-2 px-3 text-right font-medium">${formatEuro(e.kosten)}</td>
          <td class="py-2 px-3">${billedBadge(e.billed)}</td>
          <td class="py-2 px-3"><div class="flex gap-1 justify-end">
            <button onclick="openEditTimeEntry(${e.id},${taskId})" class="${BS} !px-2 !min-h-[44px]">✏️</button>
            <button onclick="deleteTimeEntry(${e.id},${taskId})" class="${BD} !px-2 !min-h-[44px]">🗑</button>
          </div></td>
        </tr>`).join('')}
      </tbody>
    </table>
  </div>`;

  const timeHTML = times.length === 0
    ? `<p class="text-sm text-gray-400">Noch keine Zeiteinträge.</p>`
    : `<div class="sm:hidden space-y-3">${timeCards}</div>${timeTable}`;

  // --- Material ---
  const matCards = mats.map(m => `
    <div class="bg-gray-50 rounded-lg p-3">
      <div class="flex justify-between items-start gap-2">
        <div class="min-w-0">
          <span class="font-medium text-sm break-words">${esc(m.name)}</span>

        </div>

          <button onclick="deleteMaterial(${m.id},${taskId})" class="${BD} !px-2 !min-h-[44px]">🗑</button>
        </div>
      </div>
    </div>`).join('');

  const matTable = `<div class="hidden sm:block overflow-x-auto">
    <table class="w-full text-sm">
      <thead class="text-xs text-gray-400 uppercase border-b border-gray-100">
        <tr><th class="py-2 px-3 text-left">Bezeichnung</th><th class="py-2 px-3 text-right">Menge</th>
          <th class="py-2 px-3 text-left">Einheit</th><th class="py-2 px-3 text-right">Einzelpreis</th>
          <th class="py-2 px-3 text-right">Summe</th><th class="py-2 px-3 text-left">Rechnung</th><th></th></tr>
      </thead>
      <tbody>
        ${mats.map(m => `<tr class="border-b border-gray-50">
          <td class="py-2 px-3 break-words">${esc(m.name)}</td>
          <td class="py-2 px-3 text-right">${m.qty}</td>
          <td class="py-2 px-3">${esc(m.unit||'Stk')}</td>
          <td class="py-2 px-3 text-right">${formatEuro(m.unit_price)}</td>
          <td class="py-2 px-3 text-right font-medium">${formatEuro(m.kosten)}</td>
          <td class="py-2 px-3">${billedBadge(m.billed)}</td>
          <td class="py-2 px-3"><div class="flex gap-1 justify-end">
            <button onclick="openEditMaterial(${m.id},${taskId})" class="${BS} !px-2 !min-h-[44px]">✏️</button>
            <button onclick="deleteMaterial(${m.id},${taskId})" class="${BD} !px-2 !min-h-[44px]">🗑</button>
          </div></td>
        </tr>`).join('')}
      </tbody>
    </table>
  </div>`;

  const matHTML = mats.length === 0
    ? `<p class="text-sm text-gray-400">Noch keine Materialpositionen.</p>`
    : `<div class="sm:hidden space-y-3">${matCards}</div>${matTable}`;

  // --- Dokumente ---
  const docGrid = docs.length === 0
    ? `<p class="text-sm text-gray-400">Noch keine Dokumente.</p>`
    : `<div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3">
        ${docs.map(d => {
          const isImg = d.mime && d.mime.startsWith('image/');
          const thumb = isImg
            ? `<img src="/api/documents/${d.id}/file" alt="${esc(d.filename)}" loading="lazy" class="w-full h-24 object-cover rounded-lg">`
            : `<div class="w-full h-24 bg-gray-100 rounded-lg flex items-center justify-center text-3xl">📄</div>`;
          const plBtn = d.paperless_url
            ? `<a href="${esc(d.paperless_url)}" target="_blank" rel="noopener" class="text-xs bg-green-100 text-green-700 px-2 py-0.5 rounded-full">✓ Paperless</a>`

          return `<div class="relative group">
            <a href="/api/documents/${d.id}/file" target="_blank" rel="noopener">${thumb}</a>
            <p class="text-xs text-gray-500 mt-1 truncate" title="${esc(d.filename)}">${esc(d.filename)}</p>
            <div class="flex flex-wrap gap-1 mt-0.5 items-center">${plBtn}</div>
            <button onclick="deleteDoc(${d.id},${taskId})"
              class="absolute top-1 right-1 w-7 h-7 bg-red-500 text-white rounded-full text-xs opacity-0 group-hover:opacity-100 transition flex items-center justify-center" aria-label="Löschen">✕</button>
          </div>`;
        }).join('')}
      </div>`;

  view.innerHTML = `
    ${breadcrumb([
      {label:'Baustellen',href:'#/baustellen'},
      {label:'Baustelle',href:'#/baustelle/'+task.site_id},
      {label:'Aufgaben',href:'#/baustelle/'+task.site_id+'/aufgaben'},
      {label:task.title}
    ])}

    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-4 mb-4">
      <div class="flex flex-wrap items-start gap-3 justify-between">
        <div class="min-w-0">
          <h1 class="text-xl font-bold break-words">${esc(task.title)}</h1>
          <div class="flex flex-wrap gap-2 mt-2">
            ${statusBadge(task.status)}
            <span class="text-sm text-gray-500 self-center">${esc(tradeName(task.trade_id))}</span>
          </div>
          ${task.description ? `<p class="text-sm text-gray-600 mt-2 break-words whitespace-pre-wrap">${esc(task.description)}</p>` : ''}
        </div>
        <button onclick="openEditAufgabeModal(${taskId})" class="${BS} shrink-0">✏️ Bearbeiten</button>
      </div>

      <div class="mt-4 flex flex-wrap gap-2 items-center border-t border-gray-100 pt-3">
        <span class="text-sm text-gray-500">Status:</span>
        ${['offen','in Arbeit','fertig'].map(s =>
          `<button onclick="changeStatus(${taskId},'${s}')"
            class="min-h-[44px] px-3 py-2 rounded-lg text-sm border transition ${task.status===s?'bg-blue-600 text-white border-blue-600':'border-gray-300 hover:bg-gray-50'}">${s}</button>`
        ).join('')}
      </div>
    </div>

    <div class="bg-blue-50 border border-blue-100 rounded-xl p-4 mb-4">
      <div class="grid grid-cols-3 gap-3 text-center">
        <div><p class="text-xs text-gray-500 uppercase mb-1">Material</p><p class="font-bold">${formatEuro(kosten.material)}</p></div>
        <div><p class="text-xs text-gray-500 uppercase mb-1">Personal</p><p class="font-bold">${formatEuro(kosten.personal)}</p></div>
        <div><p class="text-xs text-gray-500 uppercase mb-1">Gesamt</p><p class="font-bold text-blue-700 text-lg">${formatEuro(kosten.gesamt)}</p></div>
      </div>
    </div>

    <div class="bg-white rounded-xl shadow-sm border border-gray-100 mb-4">
      <div class="flex items-center justify-between px-4 py-3 border-b border-gray-100">
        <span class="font-semibold">Zeiten (Personal)</span>
        <button onclick="openNeuTimeEntry(${taskId})" class="${BP} !min-h-[36px] !py-1.5">+ Zeit erfassen</button>
      </div>
      <div class="p-4">${timeHTML}</div>
    </div>

    <div class="bg-white rounded-xl shadow-sm border border-gray-100 mb-4">
      <div class="flex items-center justify-between px-4 py-3 border-b border-gray-100">
        <span class="font-semibold">Material</span>
        <button onclick="openNeuMaterial(${taskId})" class="${BP} !min-h-[36px] !py-1.5">+ Materialposition</button>
      </div>
      <div class="p-4">${matHTML}</div>
    </div>

    <div class="bg-white rounded-xl shadow-sm border border-gray-100 mb-4">
      <div class="flex items-center justify-between px-4 py-3 border-b border-gray-100">
        <span class="font-semibold">Dokumente &amp; Fotos</span>
        <button onclick="openUploadModal(${taskId},null)" class="${BP} !min-h-[36px] !py-1.5">+ Hochladen</button>
      </div>
      <div class="p-4">${docGrid}</div>
    </div>

    <button onclick="deleteAufgabe(${taskId},${task.site_id})" class="${BD} w-full mt-2">Aufgabe löschen</button>`;
}

window.changeStatus = async function(taskId, status) {
  try {
    await api('PUT', '/api/tasks/' + taskId, { status });
    await renderAufgabeDetail(taskId);
  } catch(err) { showError(err.message); }
};

    navigate('#/baustelle/' + sid + '/aufgaben');
  } catch(err) { showError(err.message); }
};

  if (!confirm('Zeiteintrag löschen?')) return;
  try {
    await api('DELETE', '/api/timeentries/' + eid);
    showToast('Zeiteintrag gelöscht.', 'success');
    await renderAufgabeDetail(taskId);
  } catch(err) { showError(err.message); }
};

// ============================================================
// MATERIAL MODALS
// ============================================================

let _matBilled = 1;

const UNIT_DATALIST = `<datalist id="unit-dl">
  <option value="Stk"><option value="m²"><option value="m³"><option value="m">
  <option value="kg"><option value="t"><option value="l"><option value="Pkg"><option value="Rl">
</datalist>`;

window.openNeuMaterial = function(taskId) {
  _matBilled = 1;
  openModal(`${modalHeader('Materialposition hinzufügen')}
    <form onsubmit="submitNeuMaterial(event,${taskId})" class="p-4">
      ${formRow('Bezeichnung *', `<input id="mf-mn-name" class="${IC}" required placeholder="z.B. Ziegelsteine">`)}
      <div class="grid grid-cols-2 gap-3">
        ${formRow('Menge *', `<input id="mf-mn-qty" type="number" step="0.001" min="0" class="${IC}" required placeholder="z.B. 100">`)}
        ${formRow('Einheit', `<input id="mf-mn-unit" class="${IC}" placeholder="Stk, m², kg …" list="unit-dl">${UNIT_DATALIST}`)}
      </div>
      ${formRow('Einzelpreis (€) *', `<input id="mf-mn-price" type="number" step="0.01" min="0" class="${IC}" required placeholder="z.B. 0.50">`)}
      ${formRow('Rechnungs-Flag', billedToggleHTML(1,'setMatBilled'))}
      <div class="flex gap-3 mt-4">
        <button type="submit" class="${BP} flex-1">Speichern</button>
        <button type="button" onclick="closeModal()" class="${BS}">Abbrechen</button>
      </div>
    </form>`);
};

window.setMatBilled = function(val) { _matBilled = val; updateBilledToggle(val); };

window.submitNeuMaterial = async function(e, taskId) {
  e.preventDefault();
  try {
    await api('POST', '/api/tasks/' + taskId + '/materials', {
      name:       document.getElementById('mf-mn-name').value.trim(),
      qty:        parseFloat(document.getElementById('mf-mn-qty').value),
      unit:       document.getElementById('mf-mn-unit').value.trim() || null,
      unit_price: parseFloat(document.getElementById('mf-mn-price').value),
      billed:     _matBilled,
    });
    showToast('Material gespeichert.', 'success');
    closeModal();
    await renderAufgabeDetail(taskId);
  } catch(err) { showError(err.message); }
};

window.openEditMaterial = async function(mid, taskId) {
  const d = await api('GET', '/api/tasks/' + taskId + '/materials');
  const m = (d.materials||[]).find(m => m.id === mid);
  if (!m) { showError('Position nicht gefunden.'); return; }
  _matBilled = m.billed;
  openModal(`${modalHeader('Materialposition bearbeiten')}
    <form onsubmit="submitEditMaterial(event,${mid},${taskId})" class="p-4">
      ${formRow('Bezeichnung *', `<input id="mf-me-name" class="${IC}" required value="${esc(m.name)}">`)}
      <div class="grid grid-cols-2 gap-3">
        ${formRow('Menge *', `<input id="mf-me-qty" type="number" step="0.001" min="0" class="${IC}" required value="${m.qty}">`)}
        ${formRow('Einheit', `<input id="mf-me-unit" class="${IC}" value="${esc(m.unit||'')}" list="unit-dl2">
          <datalist id="unit-dl2"><option value="Stk"><option value="m²"><option value="m"><option value="kg"><option value="l"></datalist>`)}
      </div>
      ${formRow('Einzelpreis (€) *', `<input id="mf-me-price" type="number" step="0.01" min="0" class="${IC}" required value="${m.unit_price}">`)}
      ${formRow('Rechnungs-Flag', billedToggleHTML(m.billed,'setMatBilled'))}
      <div class="flex gap-3 mt-4">
        <button type="submit" class="${BP} flex-1">Speichern</button>
        <button type="button" onclick="closeModal()" class="${BS}">Abbrechen</button>
      </div>
    </form>`);
};

window.submitEditMaterial = async function(e, mid, taskId) {
  e.preventDefault();
  try {
    await api('PUT', '/api/materials/' + mid, {
      name:       document.getElementById('mf-me-name').value.trim(),
      qty:        parseFloat(document.getElementById('mf-me-qty').value),
      unit:       document.getElementById('mf-me-unit').value.trim() || null,
      unit_price: parseFloat(document.getElementById('mf-me-price').value),
      billed:     _matBilled,
    });
    showToast('Material aktualisiert.', 'success');
    closeModal();
    await renderAufgabeDetail(taskId);
  } catch(err) { showError(err.message); }
};

window.deleteMaterial = async function(mid, taskId) {
  if (!confirm('Materialposition löschen?')) return;
  try {
    await api('DELETE', '/api/materials/' + mid);
    showToast('Materialposition gelöscht.', 'success');
    await renderAufgabeDetail(taskId);
  } catch(err) { showError(err.message); }
};

// ============================================================
// DOKUMENT-UPLOAD MODAL
// ============================================================

window.openUploadModal = function(taskId, materialId) {
  openModal(`${modalHeader('Dokument / Foto hochladen')}
    <form onsubmit="submitUpload(event,${taskId!=null?taskId:'null'},${materialId!=null?materialId:'null'})" class="p-4">
      ${formRow('Datei * (Bild oder PDF, max. 20 MB)',
        `<input id="mf-ul-file" type="file" accept="image/*,.pdf" capture="environment"
          class="${IC} py-2 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-sm file:bg-blue-50 file:text-blue-700" required>`)}
      ${formRow('Typ', `<select id="mf-ul-type" class="${SC}">
        <option value="beleg">Beleg</option>
        <option value="rechnung">Rechnung</option>
        <option value="foto">Foto</option>
      </select>`)}
      <div class="flex gap-3 mt-4">
        <button type="submit" class="${BP} flex-1">Hochladen</button>
        <button type="button" onclick="closeModal()" class="${BS}">Abbrechen</button>
      </div>
    </form>`);
};

window.submitUpload = async function(e, taskId, materialId) {
  e.preventDefault();
  const fi = document.getElementById('mf-ul-file');
  if (!fi.files.length) { showError('Keine Datei ausgewählt.'); return; }
  const fd = new FormData();
  fd.append('file', fi.files[0]);
  fd.append('doc_type', document.getElementById('mf-ul-type').value);
  if (taskId !== null && taskId !== 'null') fd.append('task_id', String(taskId));
  if (materialId !== null && materialId !== 'null') fd.append('material_id', String(materialId));
  try {
    await apiUpload('/api/documents', fd);
    showToast('Dokument hochgeladen.', 'success');
    closeModal();
    const hash = window.location.hash;
    if (hash.startsWith('#/aufgabe/')) {
      await renderAufgabeDetail(parseInt(hash.split('/')[2]));
    } else {
      render();
    }
  } catch(err) { showError(err.message); }
};

window.deleteDoc = async function(docId, taskId) {
  if (!confirm('Dokument löschen?')) return;
  try {
    await api('DELETE', '/api/documents/' + docId);
    showToast('Dokument gelöscht.', 'success');
    if (taskId) await renderAufgabeDetail(taskId);
    else render();
  } catch(err) { showError(err.message); }
};

window.sendToPaperless = async function(docId, taskId) {
  try {
    showToast('Wird an Paperless gesendet…');
    await api('POST', '/api/documents/' + docId + '/paperless');
    showToast('An Paperless gesendet.', 'success');
    if (taskId) await renderAufgabeDetail(taskId);
    else render();
  } catch(err) { showError(err.message); }
};

// ============================================================
// VIEW: DOKUMENTE (#/baustelle/<sid>/dokumente)
// ============================================================

async function renderDokumente(sid) {
  const view = document.getElementById('view');
  view.innerHTML = loadingSpinner();

  const qs = window.location.hash.includes('?') ? window.location.hash.split('?')[1] : '';
  const filterType = new URLSearchParams(qs).get('type') || '';

  let apiPath = '/api/documents?site_id=' + sid;
  if (filterType) apiPath += '&doc_type=' + encodeURIComponent(filterType);

  const [siteData, docsData] = await Promise.all([
    api('GET', '/api/sites/' + sid),
    api('GET', apiPath),
  ]);
  const site = siteData.site;
  const docs = docsData.documents || [];

  const typeFilter = `<div class="flex flex-wrap gap-2 mb-4">
    ${['','rechnung','beleg','foto'].map(t => `
      <button onclick="dokTypeFilter(${sid},'${t}')"
        class="min-h-[44px] px-4 py-2 rounded-lg text-sm border transition ${filterType===t?'bg-blue-600 text-white border-blue-600':'border-gray-300 bg-white hover:bg-gray-50'}">
        ${t || 'Alle'}
      </button>`).join('')}
  </div>`;

  const gallery = docs.length === 0
    ? emptyState('Keine Dokumente gefunden.')
    : `<div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3">
        ${docs.map(d => {
          const isImg = d.mime && d.mime.startsWith('image/');
          const thumb = isImg
            ? `<img src="/api/documents/${d.id}/file" alt="${esc(d.filename)}" loading="lazy" class="w-full h-28 object-cover rounded-xl">`
            : `<div class="w-full h-28 bg-gray-100 rounded-xl flex items-center justify-center text-4xl">📄</div>`;
          const plBtn = d.paperless_url
            ? `<a href="${esc(d.paperless_url)}" target="_blank" rel="noopener" class="text-xs bg-green-100 text-green-700 px-2 py-0.5 rounded-full">✓ Paperless</a>`
            : (State.paperlessEnabled ? `<button onclick="sendToPaperless(${d.id},null)" class="text-xs text-blue-600 hover:underline min-h-[32px]">→ Paperless</button>` : '');
          return `<div class="relative group">
            <a href="/api/documents/${d.id}/file" target="_blank" rel="noopener">${thumb}</a>
            <p class="text-xs text-gray-500 mt-1 truncate" title="${esc(d.filename)}">${esc(d.filename)}</p>
            <div class="flex flex-wrap gap-1 mt-0.5 items-center">
              <span class="text-xs bg-gray-100 px-1.5 py-0.5 rounded">${esc(d.doc_type||'')}</span>
              ${d.task_id ? `<a href="#/aufgabe/${d.task_id}" class="text-xs text-blue-600 hover:underline">Aufgabe #${d.task_id}</a>` : ''}
              ${plBtn}
            </div>
            <button onclick="deleteDocSite(${d.id},${sid})"
              class="absolute top-1 right-1 w-7 h-7 bg-red-500 text-white rounded-full text-xs opacity-0 group-hover:opacity-100 transition flex items-center justify-center" aria-label="Löschen">✕</button>
          </div>`;
        }).join('')}
      </div>`;

  view.innerHTML = `
    ${breadcrumb([{label:'Baustellen',href:'#/baustellen'},{label:site.name,href:'#/baustelle/'+sid},{label:'Dokumente'}])}
    <div class="flex items-center justify-between mb-4">
      <h1 class="text-xl font-bold">Dokumente – ${esc(site.name)}</h1>
    </div>
    ${typeFilter}
    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-4">${gallery}</div>`;
}

window.dokTypeFilter = function(sid, type) {
  window.location.hash = '#/baustelle/' + sid + '/dokumente' + (type ? '?type=' + type : '');
};

window.deleteDocSite = async function(docId, sid) {
  if (!confirm('Dokument löschen?')) return;
  try {
    await api('DELETE', '/api/documents/' + docId);
    showToast('Dokument gelöscht.', 'success');
    await renderDokumente(sid);
  } catch(err) { showError(err.message); }
};

// ============================================================
// VIEW: DOKUMENTE GESAMT (#/dokumente)
// ============================================================

async function renderDokumenteGesamt() {
  const view = document.getElementById('view');
  view.innerHTML = `<h1 class="text-xl font-bold mb-4">Dokumente</h1>
    <p class="text-gray-500 mb-4">Bitte eine Baustelle wählen:</p>`;
  const data = await api('GET', '/api/sites');
  const sites = data.sites || [];
  if (!sites.length) { view.innerHTML += emptyState('Noch keine Baustellen angelegt.'); return; }
  view.innerHTML += sites.map(s => `
    <a href="#/baustelle/${s.id}/dokumente"
      class="block bg-white rounded-xl border border-gray-100 p-4 hover:shadow-md transition mb-2">
      <span class="font-medium text-blue-700">${esc(s.name)}</span>
      ${s.address ? `<span class="text-xs text-gray-400 ml-2">${esc(s.address)}</span>` : ''}
    </a>`).join('');
}

// ============================================================
// INIT
// ============================================================

async function loadConfig() {
  try {
    const d = await api('GET', '/api/config');
    State.paperlessEnabled = !!d.paperless_enabled;
  } catch {}
}

async function loadGlobalCache() {
  try {
    const [pd, sd] = await Promise.all([api('GET','/api/projects'), api('GET','/api/sites')]);
    State.projects = pd.projects || [];
    State.sites    = sd.sites    || [];
  } catch {}
}

window.addEventListener('hashchange', render);

window.addEventListener('load', async () => {
  await loadConfig();
  loadGlobalCache();
  if (!window.location.hash || window.location.hash === '#') {
    window.location.hash = '#/';
  } else {
    render();
  }
});
</script>
</body>
</html>
